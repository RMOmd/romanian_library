  {lines:[['Talentul Gabrielei Szabo a fost descoperit accidental, la 12 ani, la un concurs școlar. A fost nevoie de foarte multă muncă și disciplină pentru a valorifica acest talent, dar Gabriela este mulțumită și nu regretă sacrificiile făcute pentru cariera sa.','талант был обнаружен случайно · не жалеет о жертвах'],['A câștigat medalia de aur la Jocurile Olimpice de vară din anul 2000, la proba de 5.000 de metri și medalia de bronz la proba de 1.500 de metri. A fost de patru ori campioană mondială la seniori și o dată la juniori. În anul 2000, Gabriela Szabo a fost declarată „sportiva anului” în lume. Ea a încetat activitatea sportivă în anul 2005.','дистанция · четырежды чемпионка мира · завершила карьеру'],['Gabriela spune acum, când nu mai participă la competiții, că disciplina a fost extrem de importantă pentru cariera ei. Gabi a renunțat la multe petreceri de Crăciun sau de Revelion pentru că, în fiecare dimineață, s-a trezit la ora 6.00 pentru antrenament.','отказалась от праздников на Рождество и Новый год'],['A avut același antrenor de la începutul până la finalul activității ei. Acum, ea are aceeași dragoste pentru sport și aceeași disciplină. Este președintele Asociației „Sport pentru viață”, o asociație înființată de ea în anul 2006 pentru a stimula copiii și tinerii din România să facă sport.','тот же тренер · та же любовь · основанная ею']]},
  TABS2([X('Упр. 11','Подберите слово к определению.',[M([['competiție (sportivă) care se termină cu un clasament','concurs'],['profesie, ocupație; timpul în care cineva lucrează într-un domeniu','carieră'],['piesă de metal primită pentru locul 1, 2 sau 3','medalie'],['tip de competiție sportivă într-o competiție mai mare','probă'],['persoană care câștigă locul 1 într-o competiție','campion'],['sportiv care are peste 18 ani','senior'],['sportiv tânăr, aproximativ între 13 și 19 ani','junior'],['persoană calificată care pregătește sportivi pentru competiții','antrenor']],null,true)]),
   X('Упр. 12','Ответьте на вопросы по тексту.',[T([['<span class="ro">Cum a devenit Gabriela Szabo o sportivă foarte bună?</span>','Gabriela a devenit o sportivă foarte bună prin muncă multă și disciplină.'],['<span class="ro">De când nu mai face Gabriela Szabo sport de performanță?</span>','Gabriela nu mai face sport de performanță din 2005.'],['<span class="ro">Ce face în prezent Gabriela Szabo?</span>','În prezent, Gabriela Szabo este președintele Asociației „Sport pentru viață”.'],['<span class="ro">De ce a fost înființată Asociația „Sport pentru viață”?</span>','Asociația a fost înființată pentru a stimula copiii și tinerii din România să facă sport.']])])])]},

  TABS2([X('Упр. 18','Что означают числа в тексте о чемпионате мира 2010? Образец: 19 — a nouăsprezecea ediție…',[{lines:[['În 2010 Campionatul Mondial de Fotbal a ajuns la a nouăsprezecea ediție – prima ediție organizată pe continentul african. Între 11 iunie și 11 iulie, în Africa de Sud, 32 de echipe naționale de fotbal joacă pentru a câștiga marele trofeu. Jabulani este mingea oficială pentru această ediție. Este a unsprezecea minge fabricată special pentru un turneu final de fotbal și are unsprezece culori, una pentru fiecare jucător de pe teren. Din păcate, este a treia oară când România nu s-a calificat la turneul final.','девятнадцатый · первый на африканском континенте · одиннадцатый мяч · в третий раз']]},T([['1','prima ediție organizată pe continentul african'],['11','a unsprezecea minge fabricată special pentru un turneu final de fotbal'],['3','a treia oară când România nu s-a calificat la un turneu final']])]),

 {t:'Сафари',h:'Если не футбол, то… сафари',ro:'Dacă nu fotbal, atunci… safari',b:[
  {cards:[['elefant','слон','🐘'],['crocodil','крокодил','🐊'],['zebră','зебра','🦓'],['leu','лев','🦁'],['girafă','жираф','🦒'],['hipopotam','бегемот','🦛'],['maimuță','обезьяна','🐒'],['șarpe','змея','🐍']],small:true},
  {lines:[['Dacă echipa voastră națională nu s-a calificat la turneul final de fotbal din 2010, puteți merge în Africa de Sud pentru un safari. Această țară are rezervații naturale foarte mari, cu 12.000 de elefanți, crocodili, zebre și lei, dar și girafe, hipopotami sau maimuțe și multe alte animale sălbatice.','заповедники · дикие животные'],['În Parcul Național Kruger din Africa de Sud, puteți avea o vacanță de vis. Un ghid experimentat poate alege orele potrivite și locurile unde animalele dorm, beau apă sau se plimbă.','отпуск мечты · опытный гид']]},

 {t:'Сравнение',h:'Больше, меньше, так же',ro:'Adjectivul: comparativul',b:[
  {table:{head:['Степень','Схема','Пример'],rows:[['превосходство («более»)','[mai] + прил. + ([decât] …)','Acest munte este [mai înalt decât] acela.'],['равенство («такой же»)','[la fel de] / [tot atât de] / [tot așa de] + прил. + ([ca] …)','Această țară este [la fel de mare ca] aceea.'],['недостаток («менее»)','[mai puțin] + прил. + ([decât] …)','Dealul este [mai puțin înalt decât] muntele.']]}},
  {note:'Как в русском «выше, чем»: <span class="ro">mai înalt decât</span>. Прилагательное согласуется в роде и числе: <span class="ro">Dunărea este mai îngustă</span>, <span class="ro">munții sunt mai înalți</span>. Усиление: <span class="ro">mult mai mare</span> — гораздо больше.'},
  {lines:[['În România nu trăiesc la fel de multe animale sălbatice ca în Africa de Sud. România are o suprafață mai puțin extinsă decât Africa de Sud, iar la noi zonele rămase neschimbate de civilizație sunt mai reduse. Aici, vara nu e mult mai caldă decât acolo, dar iarna temperaturile pot fi foarte mici.','не так много · меньшая площадь'],['La noi însă sunt forme de relief mai variate, pentru că avem munți și dealuri, podișuri și câmpie, și plajă lângă mare. În România sunt mai puține parcuri naționale și nu tot atât de mari ca în Africa de Sud. Iarna, turiștii pot face schi și alte sporturi de sezon, mai mult sau mai puțin periculoase.','более разнообразный рельеф · не такие большие']]},
  TABS2([X('Упр. 26','К какой степени относится выражение из текста? a — превосходство, b — равенство, c — недостаток.',[PICK([['mai reduse','a'],['mult mai caldă','a'],['mai variate','a'],['mai puține','a'],['la fel de multe','b'],['tot atât de mari','b'],['mai puțin extinsă','c'],['mai puțin periculoase','c']],['a','b','c'])]),
   X('Упр. 27','Сравните. Образец: Cluj / Tokyo (mare / mic) → Tokyo este mai mare decât Clujul.',[FILL([['Fluviul Sena / fluviul Nil (lung)','Fluviul Nil este mai lung decât fluviul Sena.|Fluviul Nil e mai lung decât fluviul Sena.|Nilul este mai lung decât Sena.'],['Fluviul Sena / fluviul Nil (scurt)','Fluviul Sena este mai scurt decât fluviul Nil.|Fluviul Sena e mai scurt decât fluviul Nil.|Sena este mai scurtă decât Nilul.'],['Vârful Everest / Mont Blanc (înalt)','Vârful Everest este mai înalt decât Mont Blanc.|Vârful Everest e mai înalt decât Mont Blanc.'],['Vârful Everest / Mont Blanc (mic)','Mont Blanc este mai mic decât vârful Everest.|Mont Blanc e mai mic decât vârful Everest.'],['Roma / New York (vechi)','Roma este mai veche decât New Yorkul.|Roma e mai veche decât New Yorkul.'],['Roma / New York (nou)','New Yorkul este mai nou decât Roma.|New Yorkul e mai nou decât Roma.'],['Amazon / Dunărea (lat)','Amazonul este mai lat decât Dunărea.|Amazonul e mai lat decât Dunărea.'],['Amazon / Dunărea (îngust)','Dunărea este mai îngustă decât Amazonul.|Dunărea e mai îngustă decât Amazonul.'],['Rusia / România (mare)','Rusia este mai mare decât România.|Rusia e mai mare decât România.'],['Rusia / România (mic)','România este mai mică decât Rusia.|România e mai mică decât Rusia.']])]),
   X('Упр. 28','Сравните: примеры ответов по ключу.',[T([['câine · muscă · elefant · șarpe','Câinele e mai inteligent decât musca. Câinele e mai mic decât elefantul. Musca e mai puțin periculoasă decât șarpele.'],['mare · câmpie · deal · munte','Marea e mai interesantă decât câmpia. Dealul e mai înalt decât câmpia. Muntele e mai periculos decât câmpia.']])])])]},
 {t:'Самый',h:'Самый-самый: превосходная степень',ro:'Adjectivul: superlativul',b:[
  {table:{head:['Вид','Схема','Пример'],rows:[['относительная («самый … из»)','[cel / cea / cei / cele] + [mai] + прил. + ([din] …)','[Cel mai înalt] munte [din] Africa este Kilimanjaro. = Muntele [cel mai înalt] din Africa…'],['абсолютная («очень»)','[foarte] + прил. · [extrem / deosebit / extraordinar de] + прил. · прил. + [de tot]','Este un munte [foarte înalt]. · Este un munte [extrem de înalt].']]}},
  {note:'Артикль <span class="ro">cel</span> согласуется с существительным: <span class="ro">cel mai bun film, cea mai bună mâncare, cei mai scumpi pantofi, cele mai frumoase locuri</span>. «Из» после превосходной степени — <span class="ro">din</span> (+ ед. ч.) или <span class="ro">dintre</span> (+ мн. ч.).'},
  TABS2([X('Упр. 30','Викторина «самое-самое». Выберите ответ, потом проверьте по записи.',[{html:`<div class="row" style="flex-wrap:wrap">${sayBtn('Știi care e cel mai lung fluviu din lume? Nu știu sigur dacă e Nilul sau Amazonul. Amazonul deține și el un record. Dar e cel mai lat fluviu din lume, nu cel mai lung. Atunci e Nilul, nu-i așa? Ba da. Așa e.')}<span class="cap">1</span>${sayBtn('Care e cea mai mare țară din lume? Ca număr de locuitori e China. Dar eu vreau să știu țara cu cea mai mare suprafață. Atunci, vorbim despre Rusia.')}<span class="cap">2</span>${sayBtn('Acum, întreb eu. Care e cel mai mare lac din lume? Știu! Chiar dacă se numește mare, Marea Caspică este cel mai mare lac din lume.')}<span class="cap">3</span>${sayBtn('Știi și care e cea mai vorbită limbă din lume? Știu. Toată lumea crede că e engleza, dar nu e așa. Cea mai vorbită limbă din lume este chineza.')}<span class="cap">4</span>${sayBtn('Și acum, ultima întrebare. Care e cea mai mare insulă din lume? Nu știu. E Madagascar? Nu, nu e Madagascar. De fapt, e Groenlanda.')}<span class="cap">5</span></div>`},{pick:[['<span class="ro">Care este cel mai lung fluviu din lume?</span>',['Mississippi','Nilul','Amazonul'],'Nilul'],['<span class="ro">Care este cea mai mare țară din lume?</span>',['China','SUA','Rusia'],'Rusia'],['<span class="ro">Care este cel mai întins lac din lume?</span>',['Marea Caspică','Victoria','Baikal'],'Marea Caspică'],['<span class="ro">Care este cea mai vorbită limbă din lume?</span>',['chineza','engleza','spaniola'],'chineza'],['<span class="ro">Care este cea mai mare insulă din lume?</span>',['Madagascar','Groenlanda','Borneo'],'Groenlanda']]}]),
   X('Упр. 31','Составьте вопрос. Образец: Care / bun / film / în prezent? → Care este cel mai bun film în prezent?',[FILL([['Cine / cunoscut / persoană / țara ta?','Cine e cea mai cunoscută persoană din țara ta?|Cine este cea mai cunoscută persoană din țara ta?'],['Care / interesant / profesie?','Care e cea mai interesantă profesie?|Care este cea mai interesantă profesie?'],['Care / popular / marcă de mașină?','Care e cea mai populară marcă de mașină?|Care este cea mai populară marcă de mașină?'],['Care / periculos / sport?','Care e cel mai periculos sport?|Care este cel mai periculos sport?'],['Care / interesant / loc / țara ta?','Care e cel mai interesant loc din țara ta?|Care este cel mai interesant loc din țara ta?'],['Care / bun / mâncare / pentru tine?','Care e cea mai bună mâncare pentru tine?|Care este cea mai bună mâncare pentru tine?']])]),
   X('Упр. 32','Сравнительная или превосходная степень?',[C('1. Cine este {cea mai celebră§celebru} persoană din țara ta? 2. Acest oraș este mult {mai mic§mic} decât capitala. 3. Această mașină este {mai rapidă§rapid} decât mașina mea veche. 4. Nu am destui bani. Voi cumpăra un bilet {mai ieftin|cel mai ieftin§ieftin}. 5. Acestea sunt {cele mai frumoase§frumos} locuri din țara mea. 6. Vrei acești pantofi? Sunt {cei mai scumpi§scump} din magazin. 7. {Cea mai înaltă§înalt} clădire din oraș este lângă parc. 8. Avem o ofertă {mai bună§bun} decât alte agenții. 9. Acest muzeu are {cele mai vechi§vechi} cărți din țara noastră. 10. Râul este {extrem§curat} de curat. Poți vedea peștii care înoată.')])])]},
 {t:'Проверь себя',h:'Проверь себя',ro:'Verifică-te',b:[{quiz:[
  ['«эта команда»:',['această echipă','aceasta echipă','acest echipă','echipa această'],0,'Перед существительным ж. р. — <span class="ro">această</span>.'],

 init(){
  /* demonstratives builder */
  const N=[['sport','sportul',0],['jucătoare','jucătoarea',1],['sportivi','sportivii',2],['mingi','mingile',3],['stadion','stadionul',0],['stadioane','stadioanele',3],['antrenori','antrenorii',2],['echipă','echipa',1]];
  const F=[[['acest','această','acești','aceste'],['acesta','aceasta','aceștia','acestea']],[['acel','acea','acei','acele'],['acela','aceea','aceia','acelea']],[['același','aceeași','aceiași','aceleași'],null]];
  const n=$('#u11dmN'),t=$('#u11dmT'),p=$('#u11dmP');
  if(n){n.innerHTML=N.map((x,i)=>`<option value="${i}">${x[0]}</option>`).join('');
   const r=()=>{const [w,wa,g]=N[+n.value],ti=+t.value;let pi=+p.value;p.disabled=ti===2;if(ti===2)pi=0;
    const out=pi===0?`<span class="art">${F[ti][0][g]}</span> ${w}`:`${wa} <span class="art">${F[ti][1][g]}</span>`;
    $('#u11dmO').innerHTML=out;$('#u11dmS').innerHTML=sayBtn(out.replace(/<[^>]+>/g,''))};
   [n,t,p].forEach(e=>e.addEventListener('change',r));r()}
  /* ordinal slider */
  const ordM=k=>{if(k===1)return 'primul';const w=numWords(k,false);return 'al '+(/opt$/.test(w)?w+'ulea':w+'lea')};

   X('Упр. 4','Вставьте a-l durea (местоимение + глагол).',[C('1. Sunt bolnav, nu merg azi la școală. Cred că am gripă: {mă doare} capul, {mă dor} mușchii, {mă doare} gâtul și am febră. 2. Pentru că se uită prea mult la televizor, pe Andra {o dor} ochii. 3. Din cauză că am scris prea mult azi, {mă dor|ne dor} degetele. Avem nevoie de o pauză. 4. Fiindcă au mers prea mult pe jos, pe Diana și pe Maria {le dor picioarele|le dor}. 5. Rucsacul acesta e foarte greu. {Mă doare} spatele.')]),

  {note:'Местоимение всегда стоит <b>перед</b> вспомогательным глаголом (<span class="ro">va, a, am…</span>) и сливается с ним через дефис: <span class="ro">m-a, te-a, l-a, ne-a, v-a, i-a, le-a</span>. Единственное исключение — <span class="ro">o</span>: оно встаёт <b>после</b> причастия: <span class="ro">a ajutat-o, am văzut-o</span>.'},

  TABS2([X('Упр. 23','Послушайте отрывок радиопередачи о здоровье и заполните пропуски.',[{html:`<div class="row">${sayBtn('Dragi ascultători, când nu mâncăm sănătos, apar multe probleme de sănătate: ne îngrășăm, ne doare capul, obosim repede și nu avem energie. De aceea, trebuie să consumăm zilnic lactate, să evităm mâncarea nesănătoasă, să includem în alimentație fructe și legume proaspete. Nu este bine să mâncăm între mesele principale. La micul dejun trebuie să mâncăm bine, ca să avem energie. Seara e mai bine să mâncăm ceva ușor. Dacă aveți un prieten sau pe cineva din familie care nu se alimentează corect, trebuie să îl ajutați să schimbe acest lucru. Și cantitatea de mâncare este importantă. Mâncați suficient, dar nu prea mult. Știți foarte bine ce se spune: dimineața mănânc mâncarea singur, la prânz o împart cu un prieten, iar seara o dau dușmanilor. Vă așteptăm și mâine la rubrica de sănătate!')}<span class="cap">Прослушать</span></div>`},
    C('Dragi ascultători, când nu mâncăm sănătos, apar multe probleme de sănătate: ne îngrășăm, ne doare {capul}, obosim repede și nu avem energie. De aceea, trebuie să consumăm zilnic {lactate}, să evităm mâncarea {nesănătoasă}, să includem în alimentație fructe și legume {proaspete}. Nu este bine să mâncăm între {mesele|mese} principale. La micul dejun trebuie să mâncăm bine ca să avem energie. Seara e mai bine să mâncăm ceva {ușor}. Dacă aveți un prieten sau pe cineva din familie care nu se alimentează corect, trebuie să {îl} ajutați să schimbe acest lucru. Și cantitatea de mâncare este importantă. Mâncați suficient, dar nu prea {mult}. Știți foarte bine ce se spune: dimineața mănânc mâncarea singur, la prânz {o} împart cu un prieten, iar seara {o} dau dușmanilor. {Vă} așteptăm și mâine la rubrica de sănătate!'),
    {note:'Пословица: «Завтрак съешь сам, обед раздели с другом, а ужин отдай врагу».'}]),
   X('Упр. 25','Подберите заголовок к каждой статье (один лишний).',[{lines:[['1. Bucătăria mediteraneeană este sănătoasă, delicioasă și ieftină. Fructele și legumele care cresc în țările cu mult soare sunt mai aromate. Mâncați multe roșii, măsline și pește. Folosiți ulei de măsline și veți fi mai sănătoși!','средиземноморская кухня: помидоры, оливки, рыба'],['2. Această băutură este foarte iubită în Japonia. Ea ne ajută să luptăm cu stresul și oboseala. De asemenea, dacă bem două, trei căni pe zi, vom avea o piele mai frumoasă. Important: apa nu trebuie să aibă mai mult de 70–80 de grade, iar planta nu trebuie să rămână în cană mai mult de 60 de secunde.','помогает бороться со стрессом; кожа красивее'],['3. Este mai importantă decât mâncarea! Toată lumea o știe. Nu are calorii și este foarte răcoritoare. Avem nevoie de 1,5–2 litri zilnic, plus lichidele din fructe și legume. Un pahar dimineața, pe stomacul gol, ajută când vrem să slăbim. Dacă nu bem suficient avem dureri de cap, suntem obosiți și nu putem să ne concentrăm.','важнее еды, без калорий'],['4. Este primul aliment din viața noastră. Îl putem bea rece sau cald, dimineața, la prânz sau seara. Dacă îl consumăm în fiecare zi, avem oase și unghii mai puternice și dinți sănătoși. Este un mic dejun ușor și sănătos. Adulții și copiii care îl beau dimineața au energie toată ziua.','первая пища в жизни; крепкие кости и ногти']]},
    LET([['Articolul 1','Sănătoși prin alimentație corectă'],['Articolul 2','Ceaiul verde ne relaxează!'],['Articolul 3','Apa – cea mai sănătoasă alegere!'],['Articolul 4','Beți lapte în fiecare zi!']],['Apa – cea mai sănătoasă alegere!','Beți lapte în fiecare zi!','Ceaiul verde ne relaxează!','Cafeaua ne face mai tineri','Sănătoși prin alimentație corectă']),
    {note:'В ключе учебника для статей 2 и 4 указаны b и c — по смыслу (зелёный чай, молоко) верно наоборот: 2 — c, 4 — b. Лишний заголовок — <span class="ro">Cafeaua ne face mai tineri</span>.'}]),

 init(){
  const Q=[['La micul dejun preferați:',['cereale cu lapte','un corn cu ciocolată','o cafea neagră și tare']],['Dormiți:',['8–9 ore pe noapte','7–8 ore pe noapte','6 ore pe noapte']],['Faceți sport:',['în fiecare zi','o dată pe săptămână','o dată pe an']],['În timpul liber:',['faceți o plimbare','mergeți la cumpărături','vă uitați la televizor']],['Luați cina:',['la ora 19.00','la ora 20.00','la ora 22.00']],['Mergeți la dentist:',['o dată sau de două ori pe an','o dată la trei ani','extrem de rar']],['Vă spălați pe dinți:',['după fiecare masă','de două ori pe zi','uneori']],['Băutura dumneavoastră preferată este:',['apa plată','sucul de fructe','apa carbogazoasă']]];
  const box=$('#u12test');const A=new Array(Q.length).fill(-1);
  const res=()=>{const done=A.every(x=>x>=0);if(!done)return `<p class="muted">Отвечено: ${A.filter(x=>x>=0).length} из ${Q.length}</p>`;const c=[0,1,2].map(k=>A.filter(x=>x===k).length);const m=c.indexOf(Math.max(...c));
   const R2=[['Majoritatea de a. — vei trăi mult și bine!','Большинство «a» — будете жить долго и счастливо!'],['Majoritatea de b. — nu e rău, dar se poate și mai bine.','Большинство «b» — неплохо, но можно и лучше.'],['Majoritatea de c. — trebuie să ai mai multă grijă de sănătatea ta!','Большинство «c» — нужно больше заботиться о здоровье!']][m];
   return `<p><b>a: ${c[0]} · b: ${c[1]} · c: ${c[2]}</b></p><p class="ro">${R2[0]}</p><p>${R2[1]}</p><div class="row">${sayBtn(R2[0])}</div>`};
  const draw=()=>{box.innerHTML=`<div class="u12tq">${Q.map(([q,o],i)=>`<div class="u12qi"><b class="ro">${i+1}. ${q}</b><div class="u12opts">${o.map((x,k)=>`<button data-u12t="${i}-${k}" aria-pressed="${A[i]===k}"><span class="muted">${'abc'[k]}.</span> <span class="ro">${x}</span></button>`).join('')}</div></div>`).join('')}</div><div class="u12res">${res()}</div>`};
  box.addEventListener('click',e=>{const b=e.target.closest('[data-u12t]');if(!b)return;const [i,k]=b.dataset.u12t.split('-').map(Number);A[i]=k;draw()});draw();
  /* a-l durea builder */
  const P2=[['mă','мне'],['te','тебе'],['îl','ему'],['o','ей'],['ne','нам'],['vă','вам'],['îi','им (м.)'],['le','им (ж.)']];
  const BP=[['capul',0,'голова'],['gâtul',0,'горло'],['stomacul',0,'живот'],['spatele',0,'спина'],['o măsea',0,'зуб'],['ochii',1,'глаза'],['dinții',1,'зубы'],['picioarele',1,'ноги'],['urechile',1,'уши'],['mușchii',1,'мышцы']];
  const TN=[['prezent','сейчас'],['pc','вчера'],['viit','завтра']];
  const st={p:0,b:0,t:0};const bld=$('#u12bld');

 {t:'Императив и дательный',h:'Императив с местоимениями в дательном падеже',ro:'Dă-mi! Spune-i!',b:[

  TABS2([X('Упр. 7','Переформулируйте: Vreau să-mi dai banii. → Dă-mi banii!',[FILL([['Vreau să-mi trimiți un e-mail.','Trimite-mi un e-mail!'],['Vreau să-mi explici lecția încă o dată.','Explică-mi lecția!|Explică-mi lecția încă o dată!'],['Aș dori să-i spui și lui Dan secretul.','Spune-i lui Dan secretul!|Spune-i și lui Dan secretul!'],['Doresc să-mi corectezi tema.','Corectează-mi tema!'],['Vreau să-mi dai cartea.','Dă-mi cartea!'],['Vreau să-i cumperi o înghețată lui Dan.','Cumpără-i o înghețată!|Cumpără-i o înghețată lui Dan!'],['Vreau să-i aduci un cadou Mariei.','Adu-i un cadou!|Adu-i un cadou Mariei!'],['Vreau să-mi gătești ceva bun.','Gătește-mi ceva bun!'],['Vreau să-mi răspunzi la mesaj.','Răspunde-mi la mesaj!'],['Vreau să-mi povestești ce s-a întâmplat.','Povestește-mi ce s-a întâmplat!']])]),
   X('Упр. 8','Дана звонит Марии рано утром. Поставьте глаголы в императив.',[C('– Alo! Maria? – Da! – Sunt Dana. {Trezește-te§a se trezi}, {spală-te§a se spăla}, {îmbracă-te§a se îmbrăca} și {vino§a veni} repede la mine! – Dar ce oră este? – Este șapte și jumătate… Dar nu contează. Trebuie să-ți spun un secret. – {Spune§a spune}-mi la telefon! – Nu pot la telefon! E un secret important. – Bine, bine, vin. – Te aștept. A! Să nu uit… {Adu§a aduce} puțin zahăr. Am uitat să cumpăr. – Așa o să fac… Dar până vin eu, tu {fă§a face} o cafea! … – Servus, Maria! Bine ai venit! – Servus! Și {zi§a zice}-mi repede. Ce secret ai?')]),
   X('Упр. 9','Вы — гость передачи «Живи здорово!». Дайте совет (пример ответа).',[{lines:[['– Domnule doctor, sunt tot timpul obosită! Ce să fac?','Доктор, я всё время уставшая! Что делать?'],['– Dormi 8 ore pe noapte, mănâncă multe legume, fă sport!','Спи 8 часов, ешь много овощей, занимайся спортом!']]}]),
   X('Упр. 10','Что вы скажете людям на картинках? Подберите номер картинки (варианты из ключа). '+pg(223),[LET([['Nu fuma!','1'],['Ia un medicament!','2'],['Cumpără o casă!','3'],['Îmbracă-te mai gros!','4'],['Nu mai plânge!','5'],['Cere ajutor!','6']],['1','2','3','4','5','6'])])])]},
 {t:'Здоровые привычки',h:'Рекомендации для здорового образа жизни',ro:'Trăiește sănătos!',b:[
  TABS2([X('Упр. 12','Послушайте рекомендации и заполните пропуски одним-двумя словами.',[{html:`<div class="row">${sayBtn('La micul dejun, mănâncă cereale cu lapte, iar, după ce ai terminat, bea și laptele care a rămas în bol, pentru că e plin de vitamine. Spală-ți dinții de două ori pe zi, timp de două minute. Dacă nu poți să te speli pe dinți după fiecare masă, folosește ață dentară sau apă de gură. Fă cât mai multă mișcare! Uneori, activitățile pe care le facem în casă pot înlocui sportul: spală vasele, mătură, șterge praful și te vei simți mult mai bine. Întâlnește-te des cu prietenii! Dacă ești fericit, vei avea mai multă energie și vei fi mai relaxat. Nu uita să petreci timp cu familia ta. Timpul care a trecut nu se mai întoarce. În final, ai grijă și de tine, nu doar de ceilalți.')}<span class="cap">Прослушать</span></div>`},C('La micul dejun, {mănâncă} cereale cu lapte, iar, după ce ai terminat, {bea} și laptele care a rămas în bol, pentru că e plin de vitamine. {Spală-ți|Spală-te} dinții de două ori pe zi, timp de două minute. Dacă nu poți să te speli pe dinți după fiecare masă, {folosește} ață dentară sau apă de gură. {Fă} cât mai multă mișcare. Uneori, activitățile pe care le facem în casă pot înlocui sportul: {spală} vasele, mătură, {șterge} praful și te vei simți mult mai bine. {Întâlnește-te} des cu prietenii. Dacă ești fericit, vei avea mai multă energie și vei fi mai relaxat. {Nu uita} să petreci timp cu familia ta. Timpul care a trecut nu se mai întoarce. În final, {ai grijă} și de tine, nu doar de ceilalți.')]),
   X('Упр. 15','Почему мы устаём? Вставьте глаголы из рамки в императиве: a mânca, a face, a sta, a evita, a bea, a consuma, a lua, a încerca, a lăsa.',[C('Te simți obosit… chiar de dimineață. Motivul posibil: ai dormit prost. {Evită} cafeaua și ciocolata după ora 7 seara, pentru că studiile au arătat că nu te lasă să dormi. Dacă ești trist sau deprimat, probabil nu ai suficientă vitamina D. {Mănâncă} pește, {stai} la soare și {fă} exerciții în aer liber. Te simți obosit… înainte de prânz. Fierul este și el foarte important. {Consumă} ouă, carne roșie și frunze verzi (spanac). Dacă n-ai băut nimic de la cafeaua de dimineață, este normal să te simți obosit. {Bea} un ceai verde sau un suc de fructe. Te simți obosit… seara devreme. Motivul posibil: stresul. {Lasă} la serviciu sau la școală problemele și {încearcă} să te gândești la ceva plăcut. Când ajungi acasă, {ia} o pauză de 10 minute.')]),
   X('Упр. 16','Полезный коктейль: фруктовый салат. Поставьте глаголы в императив.',[C('Mai întâi, {spală§a spăla} câteva fructe. {Folosește§a folosi} numai fructe proaspete. Apoi {taie§a tăia}-le în bucăți mici și {pune§a pune}-le într-un castron mare. {Adaugă§a adăuga} puțin sirop sau frișcă, {amestecă§a amesteca} și {lasă§a lăsa} totul la frigider cel puțin o jumătate de oră. Poftă bună!')]),
   X('Слова','Полезные слова.',[{chips:[['a evita','избегать'],['fier','железо'],['spanac','шпинат'],['a sta la soare','бывать на солнце'],['a lua o pauză','сделать перерыв'],['ață dentară','зубная нить'],['a șterge praful','вытирать пыль'],['a avea grijă de','заботиться о'],['castron','миска'],['frișcă','взбитые сливки']]}])])]},

   X('Упр. 21a','Записка Дианы мужу (пример ответа).',[{lines:[['Dragul meu, mâine vine mama ta în vizită. Din păcate, eu sunt la serviciu până târziu. De aceea, îți las o listă cu ce trebuie să faci până ajung eu acasă:','Дорогой, завтра приезжает твоя мама…'],['• Fă cumpărăturile! • Pune mâncarea în cuptor! • Fă curat și șterge praful! • Așază masa!','пример ответа'],['Spor la treabă și mulțumesc mult! D.','Удачи в делах и большое спасибо!']]}]),
   X('Упр. 21b','Михаил накрывает на стол. Послушайте разговор и соедините предмет с местом.',[{html:`<div class="row">${sayBtn('Alo! Mihai? Da, draga mea! Ai ajuns acasă? Da, tocmai am ajuns. Mă uit la meci. Lasă meciul! Ai uitat că vine mama ta în vizită? Nu… Cum să uit? Mi-ai lăsat un bilet pe frigider. Bravo! Așază masa și totul e perfect. Nu uita: furculița se pune în stânga, nu în dreapta. În dreapta se pune lingura și cuțitul. Lingura e mai bine să fie așezată pe șervețel. Solnița o găsești în dulap. Pune-o lângă tava cu pahare și băuturi. Să pun și tava pe masă? Da, sigur. Paharul se pune în dreapta sau în stânga? Pune-l pe tavă, mai bine. Așa o să fac. Să nu uit să pun farfuria cu pâine pe masă. Nu, dragul meu. Mama ta nu mănâncă pâine. E la dietă. Așa e. O las în dulap.')}<span class="cap">Прослушать</span></div>`},M([['1. Furculița','d. … trebuie să fie în stânga.'],['2. Lingura','c. … se așază pe șervețel.'],['3. Cuțitul','a. … se pune în dreapta.'],['4. Solnița','b. … se pune lângă tava cu băuturi.'],['5. Paharul','f. … se așază pe tavă.'],['6. Farfuria de pâine','e. … rămâne în dulap.']],null,true)]),
   X('Упр. 22','Вставьте подходящий глагол в императиве (варианты из ключа).',[FILL([['… vasele!','Spală'],['… podeaua!','Curăță|Șterge|Spală|Mătură'],['… florile!','Udă|Culege'],['… pâinea!','Mănâncă|Taie'],['… cartofii!','Curăță|Taie|Prăjește|Fierbe'],['… fructele!','Spală|Cumpără'],['… nota de plată!','Plătește|Cere|Adu'],['… curățenie!','Fă'],['… laptele!','Bea|Fierbe|Încălzește'],['… hainele în valiză!','Pune']])])])]},

const D15=[`– Salut, Felix! Ce faci? – Servus, Maria. Mă plimb un pic prin oraș. Mă gândesc să merg în parc. – Bună idee! Afară e așa de cald. Cred că acolo e un pic mai bine, mai răcoare. – Sunt sigur că este. Vreau să văd și cum arată acum clădirea teatrului. Renovarea s-a terminat, în sfârșit. – E foarte frumoasă. Am văzut-o și eu ieri. Plimbare plăcută, Felix. – Mulțumesc, Maria. Pe curând.`,
 `– Hei, Felix! Ce faci aici? – Bună ziua, domnule profesor. Am vrut să merg în parc, dar accesul nu este permis. Acum se refac aleile și se poate intra în parc numai mâine. – Ce păcat. Și unde mergi? – Vreau să merg pe malul Someșului. E foarte cald. Lângă apă e întotdeauna mai răcoare. – Așa e. Plimbare plăcută, Felix! – Mulțumesc. La revedere!`,
 `– Bună, Felix! Unde mergi? – Servus, Mihai. Merg la Universitate. – Dar azi e duminică. De ce nu te plimbi? Și azi mergi la școală? – Am vrut să merg pe malul Someșului, dar e foarte aglomerat. Parcă toată lumea din oraș a ales să meargă azi acolo. – Așa e, dacă e cald… – Mă duc în grădina Universității. Și acolo e răcoare. – Bine, Felix. Pe mâine.`,
 `– Bună ziua, Felix! Ce faci azi la Universitate? – Vreau să stau în grădină, domnule Petre. E cald afară. – Felix, tu știi ce zi e azi? – Știu, e duminică. – Atunci știi că azi Universitatea e închisă. Nu pot să te las în grădină. În plus, grădinarul nu e azi aici. Știu că nu îi place dacă studenții merg în grădină când el lipsește. Îngrijirea plantelor e o chestiune foarte serioasă. – Bine! Atunci ne vedem mâine, când vin la cursuri.`,
 `– Servus, Felix! Ce faci? – Mă plimb prin oraș. Și voi? – Mergem la Bonțida, să vedem castelul de acolo. – E frumos? – E foarte frumos și e într-o zonă minunată. – Dar credeți că e deschis azi? – Sigur. Vizitarea castelului e permisă numai sâmbăta și duminica. – Pot să vin și eu? – Cu toată plăcerea, Felix, dar nu mai este loc. Suntem deja cinci persoane în mașină. – Ce păcat! – Îmi pare rău și mie, dar weekendul următor eu și Anca mergem din nou și atunci poți să vii cu noi.`];

/* ---------- hero replay ---------- */
document.querySelectorAll('.hero .word').forEach(hw=>{const replay=()=>{const a=hw.querySelector('.art');a.style.animation='none';void a.offsetWidth;a.style.animation=''};
hw.addEventListener('click',replay);hw.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();replay()}})});

/* ---------- chapters / toc / progress ---------- */
const CH=[...document.querySelectorAll('article.chapter')];
let cur=1,secs=[];
function setChapter(n,scroll){
  cur=n;CH.forEach(a=>a.hidden=a.id!=='ch'+n);
  const art=$('#ch'+n);secs=[...art.querySelectorAll('section')];
  $('#tocList').innerHTML=secs.map(s=>`<li><a href="#${s.id}" data-s="${s.id}"><span>${s.querySelector('.eyebrow').textContent}</span><span>${s.dataset.t}</span></a></li>`).join('');
  document.querySelectorAll('[data-chap]').forEach(b=>b.setAttribute('aria-current',+b.dataset.chap===n?'true':'false'));
  $('#mNav').innerHTML=CH.map(a=>{const k=+a.id.slice(2);return `<option value="ch${k}">${a.dataset.title}</option>`+(k===n?secs.map(s=>`<option value="${s.id}">  ${s.querySelector('.eyebrow').textContent} ${s.dataset.t}</option>`).join(''):'')}).join('');
  $('#mNav').value='ch'+n;
  store.set('pl_ch',n);try{history.replaceState(null,'','#glava'+n)}catch(e){}
  if(scroll)scrollTo({top:0});onScroll();
}
$('#mNav').addEventListener('change',e=>{const v=e.target.value;if(/^ch\d+$/.test(v)){+v.slice(2)===cur?scrollTo({top:0,behavior:'smooth'}):setChapter(+v.slice(2),true)}else document.getElementById(v).scrollIntoView({behavior:'smooth'})});
document.addEventListener('click',e=>{const b=e.target.closest('[data-chap],[data-go]');if(b){e.preventDefault();setChapter(+(b.dataset.chap||b.dataset.go),true)}});
function onScroll(){
  const y=scrollY+innerHeight*.3;let c=null;secs.forEach(s=>{if(s.offsetTop<=y)c=s.id});
  document.querySelectorAll('#tocList a').forEach(a=>a.classList.toggle('on',a.dataset.s===c));
  if(document.activeElement!==$('#mNav'))$('#mNav').value=c||('ch'+cur);
  const h=document.documentElement.scrollHeight-innerHeight;const p=h>0?Math.min(100,scrollY/h*100):0;
  $('#progBar').style.width=p+'%';$('#progBar2').style.width=p+'%';
}
addEventListener('scroll',onScroll,{passive:true});
const hm=(location.hash.match(/glava(\d+)/)||[])[1];
setChapter(hm&&$('#ch'+hm)?+hm:(store.get('pl_ch')&&$('#ch'+store.get('pl_ch'))?store.get('pl_ch'):+CH[0].id.slice(2)),false);
})();
