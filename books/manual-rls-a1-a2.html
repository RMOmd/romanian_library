<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Manual de limba română A1–A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500;1,700&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<style>
/* Layout: a squared school notebook (тетрадь в клетку) — sticky contents on the left, one reading column with a red margin rule; Romanian forms are set in Alegreya, endings and articles in "teacher's red". */
:root{
  --paper:#f6f7f3; --grid:rgba(48,78,150,.075); --sheet:#ffffff; --ink:#1d2b55; --ink-2:#55618a; --ink-3:#8c94b0;
  --red:#c42038; --red-soft:rgba(196,32,56,.09); --margin:rgba(196,32,56,.35); --mark:#f6dd7a; --mark-ink:#3b2f00;
  --line:#dde1ec; --chip:#eef1f8; --ok:#1d7a4a; --ok-soft:rgba(29,122,74,.1); --bad-soft:rgba(196,32,56,.1);
  --f-display:"Alegreya", "Georgia", "Times New Roman", serif;
  --f-body:"PT Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"PT Mono", "Consolas", "Menlo", monospace;
  --s-1:.8125rem; --s0:1rem; --s1:1.125rem; --s2:1.375rem; --s3:1.75rem; --s4:2.4rem; --s5:clamp(3rem, 9vw, 5.6rem);
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151f; --grid:rgba(150,170,230,.05); --sheet:#171c28; --ink:#e3e8f6; --ink-2:#a6b0cc; --ink-3:#6f7995;
  --red:#ff6f80; --red-soft:rgba(255,111,128,.12); --margin:rgba(255,111,128,.32); --mark:#6b5a12; --mark-ink:#fff3c4;
  --line:#2a3142; --chip:#212839; --ok:#5fd394; --ok-soft:rgba(95,211,148,.12); --bad-soft:rgba(255,111,128,.13); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151f; --grid:rgba(150,170,230,.05); --sheet:#171c28; --ink:#e3e8f6; --ink-2:#a6b0cc; --ink-3:#6f7995;
  --red:#ff6f80; --red-soft:rgba(255,111,128,.12); --margin:rgba(255,111,128,.32); --mark:#6b5a12; --mark-ink:#fff3c4;
  --line:#2a3142; --chip:#212839; --ok:#5fd394; --ok-soft:rgba(95,211,148,.12); --bad-soft:rgba(255,111,128,.13); color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--s0);line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:3px}
.ro{font-family:var(--f-display);font-weight:500}
.art{color:var(--red)}
.end{color:var(--red)}
.muted{color:var(--ink-2)}
.eyebrow{font-size:var(--s-1);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;max-width:1160px;margin:0 auto;padding-inline:24px;padding-block:28px 80px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;display:flex;flex-direction:column;gap:18px;font-size:.92rem}
.toc .book{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.25}
.toc .book small{display:block;font-family:var(--f-body);font-weight:400;color:var(--ink-2);font-size:var(--s-1);margin-top:4px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc a{display:grid;grid-template-columns:2.4em 1fr;gap:4px;padding:5px 8px;border-radius:var(--r);color:var(--ink-2);text-decoration:none;line-height:1.3}
.toc a span:first-child{font-family:var(--f-mono);font-size:.8rem;padding-top:2px}
.toc a:hover{background:var(--chip);color:var(--ink)}
.toc a.on{background:var(--sheet);color:var(--ink);box-shadow:inset 2px 0 0 var(--red)}
.toc .chapters{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px;color:var(--ink-3);font-size:var(--s-1)}
.toc .chapters b{color:var(--ink);font-weight:700}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}

.page{min-width:0;max-width:780px;display:flex;flex-direction:column;gap:72px;position:relative}
.page::before{content:"";position:absolute;left:-20px;top:0;bottom:0;width:2px;background:var(--margin)}

/* hero */
.hero{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.hero .word{font-family:var(--f-display);font-weight:800;font-size:var(--s5);letter-spacing:-.01em;line-height:1;cursor:pointer;user-select:none;white-space:nowrap;width:max-content;max-width:100%}
.hero .word .art{display:inline-block;animation:fuse 1.3s cubic-bezier(.2,.8,.2,1) .35s both}
@keyframes fuse{0%{transform:translateX(.9em) rotate(6deg)}55%{transform:translateX(-.04em)}100%{transform:none}}
.hero h1{font-size:var(--s3);font-weight:700}
.hero .lede{font-size:var(--s1);max-width:62ch;color:var(--ink-2)}
.hero .lede b{color:var(--ink)}
.forms3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.forms3 div{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.forms3 .ro{font-size:var(--s3)}
.forms3 small{color:var(--ink-2);font-size:var(--s-1)}

/* sections */
section{display:flex;flex-direction:column;gap:20px;scroll-margin-top:24px}
.sec-head{display:flex;flex-direction:column;gap:6px}
.sec-head h2{font-size:var(--s4);font-weight:700}
.sec-head .ro-title{font-family:var(--f-display);font-style:italic;color:var(--red);font-size:var(--s1)}
.prose{display:flex;flex-direction:column;gap:12px;max-width:66ch}
p.prose{display:block}
.prose em{font-style:italic;color:var(--ink)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:var(--s1);font-weight:700}
.panel ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.note{border-left:3px solid var(--mark);background:var(--sheet);padding:12px 16px;border-radius:0 var(--r) var(--r) 0;font-size:.95rem;display:block;max-width:66ch}
.note b.t{display:block;margin-bottom:4px;font-size:var(--s-1);letter-spacing:.08em;text-transform:uppercase}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:2px}

/* segmented */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--chip);padding:4px;border-radius:calc(var(--r) + 2px)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:var(--r);cursor:pointer;color:var(--ink-2);font-size:.93rem}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl > span{font-size:var(--s-1);color:var(--ink-2);font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* morph stage */
.stage{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:190px;justify-content:center}
.stage .big{font-family:var(--f-display);font-weight:700;font-size:clamp(2.4rem,8vw,3.8rem);line-height:1.1;min-height:1.15em;display:flex;align-items:baseline;gap:.25em;flex-wrap:wrap;justify-content:center}
.stage .big .w{white-space:nowrap}
.stage .big .ch{display:inline-block}
.stage .big .ch.out{animation:out .28s ease-in forwards;color:var(--red)}
.stage .big .ch.in{color:var(--red);animation:in .42s cubic-bezier(.2,.9,.3,1.3) both}
.stage .big .a-indef{color:var(--red);font-weight:500;font-style:italic;animation:slideL .45s cubic-bezier(.2,.9,.3,1.2) both}
.stage .big .a-def{color:var(--red);display:inline-block;animation:attach .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes out{to{transform:translateY(-.5em);opacity:0}}
@keyframes in{from{transform:translateY(.55em);opacity:0}}
@keyframes slideL{from{transform:translateX(-.8em);opacity:0}}
@keyframes attach{from{transform:translateX(.7em);opacity:0}}
.stage .cap{color:var(--ink-2);font-size:.95rem;max-width:52ch}
.stage .rule{font-family:var(--f-mono);font-size:.9rem;background:var(--red-soft);color:var(--red);padding:2px 8px;border-radius:4px}
.stage .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.iconbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{color:var(--red);border-color:var(--red)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:var(--s-1);color:var(--ink-2);font-weight:700;letter-spacing:.04em;background:var(--chip)}
td.ro,td .ro{font-size:1.12rem}
tr.grp td{background:transparent;color:var(--red);font-style:italic;font-family:var(--f-display);font-size:.95rem;text-align:center;padding:10px 12px 4px;border-bottom:0}
tbody tr.w{cursor:pointer;transition:background .15s}
tbody tr.w:hover{background:var(--chip)}
tbody tr.w.sel{background:var(--red-soft)}
td.rule{font-family:var(--f-mono);color:var(--red);font-size:.88rem;white-space:nowrap}
td.tr{color:var(--ink-2);font-size:.92rem}
.para td{white-space:nowrap}
.para td.c{cursor:pointer}
.para td.c:hover{background:var(--chip)}
.para td.c.sel{background:var(--red-soft);box-shadow:inset 0 0 0 1px var(--red)}
.para .gen td{font-weight:700;font-size:var(--s-1);color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;background:var(--chip)}

/* machine */
.machine{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.controls{display:flex;flex-wrap:wrap;gap:14px 20px}
.nouns{display:flex;flex-wrap:wrap;gap:6px}
.nouns button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 12px;cursor:pointer;font-family:var(--f-display);font-size:1.05rem}
.nouns button small{font-family:var(--f-body);font-size:.72rem;color:var(--ink-3);margin-left:4px}
.nouns button[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.excl{color:var(--red);font-weight:700}

/* examples */
.ex{display:flex;flex-direction:column;gap:8px}
.ex-item{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4px 18px;padding:10px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.ex-item .use{grid-column:1/-1;font-size:var(--s-1);color:var(--ink-2);font-weight:700;letter-spacing:.04em}
.ex-item .ro{font-size:1.15rem;font-style:italic}
.ex-item .ro u{text-decoration:none;background:linear-gradient(transparent 62%,var(--mark) 62%);color:inherit}
.ex-item .ru{color:var(--ink-2)}
.formula{font-family:var(--f-mono);font-size:.85rem;background:var(--chip);padding:1px 7px;border-radius:4px;color:var(--ink);white-space:nowrap}
.case-h{font-family:var(--f-display);font-size:var(--s2);font-weight:700;color:var(--ink)}
.case-h i{color:var(--red);font-weight:500}

/* vocative */
.voc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.voc button{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.voc button:hover{border-color:var(--ink-3)}
.voc button[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.voc .ro{font-size:1.15rem}
.voc small{font-family:var(--f-mono);color:var(--red);font-size:.78rem}

/* cases map */
.cmap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
.rucases{display:flex;flex-direction:column;gap:6px}
.rucases button{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:8px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.rucases button b{font-family:var(--f-display);font-size:1.08rem}
.rucases button small{color:var(--ink-2)}
.rucases button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.rucases button[aria-pressed="true"] small{color:inherit;opacity:.75}
.romap{display:flex;flex-direction:column;gap:12px;min-width:0}
.rocase{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:in .4s ease both}
.rocase h3{font-size:var(--s2)}
.rocase h3 small{font-family:var(--f-display);font-style:italic;color:var(--red);font-weight:500;font-size:1rem;margin-left:8px}
.rocase .q{font-family:var(--f-display);font-style:italic;color:var(--ink-2)}
.preps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.prep{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;background:var(--chip);border-radius:4px;animation:in .4s ease both}
.prep .ro{color:var(--red)}
.arrow{color:var(--ink-3)}

/* word formation */
.wf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.wf .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.wf .col > b{font-size:var(--s-1);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.dcard{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:9px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.dcard:hover{border-color:var(--ink-3)}
.dcard .ro{font-size:1.18rem}
.dcard .from{font-size:.82rem;color:var(--ink-3)}
.dcard .from .ro{font-size:.92rem;color:var(--ink-2)}
.dcard small{color:var(--ink-2)}
.dcard .sfx{display:inline-block}
.dcard.play .sfx{animation:attach .5s cubic-bezier(.2,.9,.3,1.3) both}
.dcard.play .pfx{animation:slideL .5s cubic-bezier(.2,.9,.3,1.3) both;display:inline-block}
.affix-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}

/* quiz */
.quiz{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink-2);font-size:var(--s-1)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--red)} .dots i.cur{box-shadow:0 0 0 2px var(--ink)}
.qq{font-family:var(--f-display);font-size:var(--s2);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts button{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:10px 14px;text-align:left;cursor:pointer;font-family:var(--f-display);font-size:1.12rem}
.opts button:hover:not(:disabled){border-color:var(--ink)}
.opts button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opts button.no{background:var(--bad-soft);border-color:var(--red);color:var(--red)}
.opts button:disabled{cursor:default}
.why{color:var(--ink-2);min-height:1.5em}
.qnav{display:flex;justify-content:flex-end;gap:8px}
.score{font-family:var(--f-display);font-size:var(--s4);font-weight:800}

footer{border-top:1px solid var(--line);padding-top:18px;color:var(--ink-2);font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.next{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:var(--sheet);border:1px dashed var(--ink-3);border-radius:var(--r);padding:14px 16px}

/* mobile top bar */
.topbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding-inline:16px;padding-block:0 60px;gap:0}
  .toc{display:none}
  .page::before{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;gap:10px;align-items:center;margin-bottom:20px}
  .topbar select{flex:1;min-width:0;font:inherit;padding:6px 8px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
  .topbar .prog{width:60px;flex:none}
  section{scroll-margin-top:64px}
  .cmap{grid-template-columns:minmax(0,1fr)}
  .rucases{flex-direction:row;flex-wrap:wrap}
  .rucases button{flex:1 1 140px}
  .wf{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .cols2,.opts{grid-template-columns:minmax(0,1fr)}
  .forms3{grid-template-columns:minmax(0,1fr)}
  .ex-item{grid-template-columns:minmax(0,1fr)}
  .sec-head h2{font-size:var(--s3)}
}

[hidden]{display:none!important}
.chapter{display:flex;flex-direction:column;gap:72px}
#adTable td,#adTable th,#rfTable td,#psTable td{white-space:nowrap}
.ch.out{animation:out .28s ease-in forwards;color:var(--red)}
.ch.in{color:var(--red);animation:in .42s cubic-bezier(.2,.9,.3,1.3) both}
.toc .chapters button{all:unset;cursor:pointer;color:var(--ink-2);padding:2px 0}
.toc .chapters button:hover{color:var(--red)}
.toc .chapters button[aria-current="true"]{color:var(--ink);font-weight:700}
.toc .chapters button:focus-visible{outline:2px solid var(--red)}
/* ch2 */
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.step{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;margin-top:calc(var(--i)*14px);animation:in .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*120ms);border-bottom:3px solid var(--ink)}
.step.empty{background:transparent;border-style:dashed;border-bottom-width:1px}
.step .iconbtn{align-self:flex-start}
.big2{font-size:clamp(1.3rem,4vw,1.8rem);font-weight:700;overflow-wrap:anywhere}
.sent{gap:.3em}
.sent .dot{margin-left:-.3em}
.stress{display:inline-block;color:var(--ink-2);font-style:italic;transition:opacity .35s,transform .35s}
.stress.leaving{text-decoration:line-through;text-decoration-color:var(--red)}
.stress.gone{display:none}
.pop{display:inline-block;animation:in .45s cubic-bezier(.2,.9,.3,1.4) both}
.psrows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;text-align:left}
.psr{display:flex;flex-direction:column;gap:4px;animation:in .45s ease both;animation-delay:calc(var(--i)*110ms);min-width:0}
.big3{font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700}
td.hl{background:var(--red-soft);box-shadow:inset 0 0 0 1px var(--red)}
.dmforms{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.dmforms > div{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;max-width:320px;justify-content:center}
.dmforms small{width:100%;text-align:center;color:var(--ink-2)}
.dmforms .ro{font-size:1.4rem;font-weight:700}
td.fl{animation:in .35s ease both;animation-delay:calc(var(--k)*18ms)}
.poslegend{display:flex;flex-direction:column;gap:6px}

<script>

(function(){
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="end">$1</span>');
const plain=s=>s.replace(/[\[\]|]/g,'');
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- speech ---------- */
let roVoice=null;
function findVoice(){try{const v=speechSynthesis.getVoices();roVoice=v.find(x=>/^ro/i.test(x.lang))||null;document.querySelectorAll('.say').forEach(b=>b.hidden=!roVoice)}catch(e){}}
if('speechSynthesis' in window){findVoice();try{speechSynthesis.addEventListener('voiceschanged',findVoice)}catch(e){}}
function say(t){if(!roVoice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=roVoice;u.lang=roVoice.lang;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const sayBtn=t=>`<button class="iconbtn say" ${roVoice?'':'hidden'} data-say="${esc(t)}" aria-label="Произнести"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M19 5.5a9 9 0 0 1 0 13"/></svg></button>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say)});

/* ---------- morph engine ---------- */
function letters(word,from,cls){return [...word].map((c,i)=>`<span class="ch${i>=from&&cls?' '+cls:''}">${c===' '?'&nbsp;':esc(c)}</span>`).join('')}
function prefixLen(a,b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i}
function morph(el,a,b,done){
  const p=prefixLen(a,b);
  el.innerHTML=`<span class="w">${letters(a,p,'out')}</span>`;
  setTimeout(()=>{el.innerHTML=`<span class="w">${letters(b,p,'in')}</span>`;done&&done()},matchMedia('(prefers-reduced-motion:reduce)').matches?0:300);
}

/* ---------- quiz engine ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuiz(sel,Q,key,weak){
  const el=$(sel);
  const fresh=()=>({i:0,res:[],order:Q.map(q=>shuffle(q[1].map((t,k)=>({t,ok:k===q[2]}))))});
  let qs=fresh();
  function render(){
    const dots=Q.map((_,k)=>`<i class="${qs.res[k]===true?'ok':qs.res[k]===false?'no':''}${k===qs.i?' cur':''}"></i>`).join('');
    if(qs.i>=Q.length){
      const s=qs.res.filter(Boolean).length,best=Math.max(s,store.get(key)||0);store.set(key,best);
      el.innerHTML=`<div class="qtop"><div class="dots">${dots}</div><span>Лучший результат: ${best} из ${Q.length}</span></div><div class="score">${s} из ${Q.length}</div><p>${s>=9?'Отлично! Глава усвоена.':s>=6?'Хорошо. Повторите разделы, где были ошибки.':weak}</p><div class="qnav"><button class="btn" data-q="restart">Пройти ещё раз</button></div>`;return;
    }

  }

  });

}

/* numbers (m/f) */
const NU9=['zero','unu','doi','trei','patru','cinci','șase','șapte','opt','nouă'];
const NTEEN={10:'zece',11:'unsprezece',12:'doisprezece',13:'treisprezece',14:'paisprezece',15:'cincisprezece',16:'șaisprezece',17:'șaptesprezece',18:'optsprezece',19:'nouăsprezece'};
const NTENS=['','','douăzeci','treizeci','patruzeci','cincizeci','șaizeci','șaptezeci','optzeci','nouăzeci'];
const nUnit=(u,f)=>u===1?(f?'una':'unu'):u===2?(f?'două':'doi'):NU9[u];
function n99(n,f){if(n<10)return nUnit(n,f);if(n<20)return n===12&&f?'douăsprezece':NTEEN[n];const t=Math.floor(n/10),u=n%10;return NTENS[t]+(u?' și '+nUnit(u,f):'')}
function n999(n,f){const h=Math.floor(n/100),r=n%100,p=[];if(h===1)p.push('o sută');else if(h>1)p.push((h===2?'două':NU9[h])+' sute');if(r)p.push(n99(r,f));return p.join(' ')}
const needDe=n=>{const k=n%100;return n>=20&&(k===0||k>=20)};
function numWords(n,f){if(n===0)return 'zero';const g=Math.floor(n/1e9),m=Math.floor(n/1e6)%1000,t=Math.floor(n/1000)%1000,r=n%1000,p=[];
  if(g)p.push(g===1?'un miliard':n999(g,true)+(needDe(g)?' de':'')+' miliarde');
  if(m)p.push(m===1?'un milion':n999(m,true)+(needDe(m)?' de':'')+' milioane');
  if(t)p.push(t===1?'o mie':n999(t,true)+(needDe(t)?' de':'')+' mii');
  if(r)p.push(n999(r,f));return p.join(' ')}
/* "N + noun": f=feminine; sg/pl forms */
function counted(n,sg,pl,f){if(n===1)return (f?'o ':'un ')+sg;const w=numWords(n,f);return w+(needDe(n)?' de ':' ')+pl}

  const prev=n>(L.first??0)?`<button class="btn ghost" data-go="${n-1}">← Урок ${n-1}</button>`:'<span></span>';
  const next=L.nextLabel?`<button class="btn" data-go="${n+1}">${L.nextLabel} →</button>`:'<span></span>';
  return `<article class="chapter" id="ch${n}" data-title="${esc(L.title)}" hidden>

    ${secs}
    <footer><div class="next">${prev}${next}</div><span>${L.src}</span></footer></article>`;
}

const ORD={};
function renderOrd(id,picked){const L=ORD[id];const el=document.getElementById(id);if(!el)return;picked=picked||[];el._p=picked;
  const rest=(el._sh=el._sh||shuffle(L.map((_,i)=>i))).filter(i=>!picked.includes(i));
  const done=picked.length===L.length,ok=done&&picked.every((v,i)=>v===i);
  el.classList.toggle('ok',ok);el.classList.toggle('bad',done&&!ok);
  el.innerHTML=`<ol class="ordseq">${picked.map((i,k)=>`<li class="${i===k?'good':'wrong'}"><span class="ro">${esc(L[i])}</span></li>`).join('')}${done?'':'<li class="slot muted">…</li>'}</ol>
   <div class="ordpool">${rest.map(i=>`<button class="ordb" data-oi="${i}"><span class="ro">${esc(L[i])}</span></button>`).join('')}</div>
   <p class="why">${done?(ok?'Верно! Порядок как в ключе.':'Есть ошибки (выделены). <button class="linkbtn" data-oreset>Заново</button>'):'Нажимайте на реплики по порядку.'}</p>`;
  if(ok)say(L.join(' '))}

  const r=e.target.closest('[data-oreset]');if(r){const w=r.closest('.ordw');renderOrd(w.id,[]);return}
  const x=e.target.closest('[data-ex="show"]');if(x){const body=x.closest('.exbody');body.querySelectorAll('select.sel2').forEach(s=>{s.value=s.dataset.uo;s.classList.add('ok')});body.querySelectorAll('.ordw').forEach(w=>renderOrd(w.id,ORD[w.id].map((_,i)=>i)));eScore(body)}});

   ['Secretara: Dumneavoastră sunteți domnul Ardelean?|Dl. Ardelean: Da, eu sunt!|Secretara: Bine ați venit la Cluj!|Dl. Ardelean: Bine v-am găsit!','d_b'],

  {note:'<b>Вежливая форма</b>: <span class="ro">Dumneavoastră cine sunteți? Dumneavoastră sunteți profesor?</span> — глагол во 2 л. мн. ч., даже если обращаемся к одному человеку.<br><b>iar</b> — «а» при сопоставлении: <span class="ro">Tu ești Felix, iar eu sunt Felicia.</span>'},

 {t:'Откуда ты?',h:'Откуда ты?',ro:'De unde ești?',b:[
  {p:'Упражнение 9. Пабло знакомится с Марией в Клуже.'},
  {lines:[['Pablo: Bună, e ocupat?','Привет, занято?'],['Maria: Nu, e liber!','Нет, свободно!'],['Pablo: Eu sunt Pablo.','Я Пабло.'],['Maria: Pablo? De unde ești?','Пабло? Откуда ты?'],['Pablo: Sunt din Spania. Dar tu cine ești?','Я из Испании. А ты кто?'],['Maria: Eu sunt Maria.','Я Мария.'],['Pablo: Îmi pare bine! Ești tot din Spania?','Приятно! Ты тоже из Испании?'],['Maria: Nu, sunt româncă.','Нет, я румынка.'],['Pablo: A, ești din România. Și el?','А, ты из Румынии. А он?'],['Maria: El este Mihai. E tot din România.','Это Михай. Он тоже из Румынии.'],['Pablo: Încântat de cunoștință.','Очень приятно.'],['Mihai: Și eu. De când ești în România?','Мне тоже. С каких пор ты в Румынии?'],['Pablo: De o săptămână.','Неделю.'],['Mihai: Bine ai venit!','Добро пожаловать!'],['Pablo: Bine te-am găsit!','Рад вас видеть!']]},
  {html:`<div class="row">${sayBtn('Bună, e ocupat? Nu, e liber! Eu sunt Pablo. Pablo? De unde ești? Sunt din Spania. Dar tu cine ești? Eu sunt Maria. Îmi pare bine! Ești tot din Spania? Nu, sunt româncă. A, ești din România. Și el? El este Mihai. E tot din România. Încântat de cunoștință. Și eu. De când ești în România? De o săptămână. Bine ai venit! Bine te-am găsit!')}<span class="cap">Прослушать весь диалог</span></div>`},
  {table:{head:['Вопрос','Ответ'],rows:[['Cine ești (tu)?','(Eu) sunt Maria.'],['De unde ești? · Din ce țară ești?','Din România. · Din Franța.'],['Unde ești acum?','Acum sunt în România, la Cluj!'],['Ce ești (tu)?','Sunt român. · Sunt student.']]},roFirst:true},
  {tabs:[{l:'Упр. 9 · вопрос — ответ',blocks:[{sel:[['De unde este Pablo?','Pablo este din Spania.'],['Pablo este român?','Nu, nu e român, e spaniol.'],['Maria este din Spania?','Nu, este din România.'],['Pablo este străin?','Da, este străin.'],['Mihai este român?','Da, este român.']].map(([q,a],_,all)=>[`<span class="ro">${q}</span>`,all.map(x=>x[1]),a])}]},
   {l:'Упр. 10 · вопрос',t:'Напишите вопрос к выделенному слову.',blocks:[{fill:[['Eu sunt <b>Maria</b>.','Cine ești?|Cine ești tu?|Cine ești (tu)?'],['Maria este <b>româncă</b>.','Ce este Maria?'],['Ea este <b>din București</b>.','De unde este?|De unde este ea?|De unde e?|De unde e ea?'],['Acum ea este <b>în Cluj-Napoca</b>.','Unde este acum?|Unde este ea acum?|Unde e acum?|Unde e ea acum?'],['Este aici <b>de o lună</b>.','De când este aici?|De când e aici?']].map(([a,b])=>[`<span class="ro">${a}</span>`,b])}]},
   {l:'Упр. 11 · континент, страна, город',blocks:[{pick:[['Madrid','oraș'],['Austria','țară'],['Africa','continent'],['Italia','țară'],['Berlin','oraș'],['Europa','continent'],['Viena','oraș'],['Norvegia','țară'],['Lisabona','oraș'],['Roma','oraș'],['Australia','continent'],['Portugalia','țară'],['București','oraș'],['Praga','oraș'],['Germania','țară'],['Budapesta','oraș'],['Asia','continent'],['Ungaria','țară'],['Franța','țară'],['Spania','țară'],['Paris','oraș'],['România','țară']].map(([w,a])=>[`<span class="ro">${w}</span>`,['continent','țară','oraș'],a])}]},
   {l:'Упр. 12 · кто это?',t:'Прочитайте и выберите фотографию.',blocks:[{sel:[['Bună, eu sunt Mihai. Sunt din România. Sunt profesor de limba română.','c'],['Salut! Sunt Noah, din Tunisia. Sunt stomatolog. Sunt în România de o lună.','b'],['Bună ziua! Eu sunt Ly Yan. Nu sunt din România, sunt din China.','a'],['Ei sunt Olof și Pavel. Olof e din Olanda, iar Pavel este din Polonia.','d'],['Eu sunt Ioana. Sunt din Canada. Dar voi de unde sunteți?','f'],['Bine v-am găsit! Noi suntem Maria și Ștefan. Suntem din Suedia.','e']].map(([t,a])=>[`<span class="ro">${t}</span>`,['a','b','c','d','e','f'],a])},{html:`<div class="pgal">${'abcdef'.split('').map(l=>`<figure>${im('p_'+l)}<figcaption>${l}</figcaption></figure>`).join('')}</div>`}]},

 {t:'Где ты?',h:'Где ты?',ro:'Unde ești?',b:[
  {p:'Упражнение 16. Феликс звонит Фелиции.'},
  {lines:[['Felix: Alo? Bună, Felicia, Felix la telefon!',''],['Ioana Pop: Bună ziua. Aici e Ioana Pop.',''],['Felix: O, mă scuzați pentru greșeală!','Ой, извините за ошибку!'],['Ioana Pop: [Nu-i nimic.]','Ничего страшного.'],['Felix: Mă numesc Felix Arben. Cu Felicia, vă rog!','Меня зовут… Позовите Фелицию, пожалуйста!'],['Ioana Pop: Îmi pare rău. Felicia nu-i acasă.','Мне жаль. Фелиции нет дома.'],['Felix: Dar unde este?','А где она?'],['Ioana Pop: E [în] oraș, [la] teatru.','В городе, в театре.'],['Felix: Mulțumesc pentru amabilitate.','Спасибо за любезность.'],['Ioana Pop: Pentru puțin. La revedere!','Не за что. До свидания!']]},
  {html:`<div class="row">${sayBtn('Alo? Bună, Felicia, Felix la telefon! Bună ziua. Aici e Ioana Pop. O, mă scuzați pentru greșeală! Nu-i nimic. Mă numesc Felix Arben. Cu Felicia, vă rog! Îmi pare rău. Felicia nu-i acasă. Dar unde este? E în oraș, la teatru. Mulțumesc pentru amabilitate. Pentru puțin. La revedere!')}<span class="cap">Прослушать разговор</span></div>`},
  {chips:[['Scuze, vă rog! · Mă scuzați! · Pardon!','извинение'],['Nu-i nimic! · Nu face nimic!','ответ на извинение'],['Mulțumesc!','спасибо'],['Cu plăcere! · Pentru puțin!','пожалуйста, не за что']]},
  {tabs:[{l:'Упр. 16 · верно/неверно',blocks:[AF([['Felicia nu este acasă.','A'],['Felix este la teatru.','F'],['Felicia este cu Felix la teatru.','F'],['Ioana Pop este acasă.','A'],['Felicia este la cinema.','F']])]},
   {l:'Упр. 17 · порядок',blocks:[{order:['– Alo, bună ziua! Familia Mureșanu?','– Bună ziua, da, Mircea Mureșanu la telefon.','– Sunt Ionuț Man. Matei este acasă?','– Nu, nu-i acasă. Este la bibliotecă.','– Mulțumesc, la revedere!','– Cu plăcere, la revedere!']}]},
   {l:'Упр. 18a · кто где?',t:'Прочитайте тексты и выберите фотографию.',blocks:[{sel:[['1. Salut! Eu sunt Vlad. Sunt în vacanță, la munte. Sunt aici de o zi.','e'],['2. Bună! Sunt Plamenka. Sunt din Bulgaria. Sunt studentă la Academia de Muzică. Acum sunt în parc. Este foarte frumos. Sunt la Cluj din octombrie.','a'],['3. Bună seara! Sunt tot eu, Plamenka. Ei sunt Ani și Dimcio. Și ei sunt din Bulgaria. Acum este seară. Suntem la teatru. Suntem aici de un minut.','b'],['4. Bună ziua! Sunt Alina Viehman, profesoară de limba română. Sunt din Cluj. Astăzi sunt la Facultatea de Litere, în clasă, la o lecție de limba română. Sunt aici de o oră.','c'],['5. Ham-ham! Eu sunt Azorel. Sunt un câine simpatic, din România. Acum este iarnă, e frig și este zăpadă. Sunt pe stradă de o jumătate de oră.','d'],['6. Bună! Noi suntem Ștefan și Daniel. Suntem afară, pe terasă, de aproximativ o oră.','f']].map(([t,a])=>[`<span class="ro">${t}</span>`,['a','b','c','d','e','f'],a]),wide:true},{html:`<div class="pgal">${'abcdef'.split('').map(l=>`<figure>${im('t_'+l)}<figcaption>${l}</figcaption></figure>`).join('')}</div>`}]},
   {l:'Упр. 18b · верно/неверно',blocks:[AF([['Plamenka este în parc.','A'],['Plamenka, Ani și Dimcio sunt la minister.','F'],['Azorel este student.','F'],['Vlad este la facultate.','F'],['Profesoara Alina este în clasă.','A'],['Ștefan și Daniel sunt pe terasă fix de o oră.','F']])]},
   {l:'Упр. 18c · о себе',t:'Расскажите о себе по модели — впишите свои данные и прочитайте вслух.',blocks:[{html:'<div class="lines"><div class="ln"><span class="ro">Eu sunt …</span><span class="muted">Я — …</span></div><div class="ln"><span class="ro">Sunt din …</span><span class="muted">Я из …</span></div><div class="ln"><span class="ro">Acum sunt în / la …</span><span class="muted">Сейчас я в …</span></div><div class="ln"><span class="ro">Sunt aici de …</span><span class="muted">Я здесь уже …</span></div></div>'}]}]}]},

 init(){
  // mood
  const M=[['Excelent!','😄'],['Foarte bine, mulțumesc!','😊'],['Mulțumesc, bine!','🙂'],['Așa și așa!','😐'],['Nu prea bine!','🙁'],['Groaznic!','😫']];
  $('#mood').innerHTML=`<input type="range" id="moodR" min="0" max="5" value="1" class="range" aria-label="Настроение"><div class="moodout" id="moodOut"></div>`;
  const mr=()=>{const m=M[+$('#moodR').value];$('#moodOut').innerHTML=`<span class="emo xl">${m[1]}</span><div class="bubble q"><span class="ro">– Ce mai faci?</span></div><div class="bubble a"><span class="ro">– ${m[0]}</span></div>`};
  $('#moodR').addEventListener('input',mr);$('#moodR').addEventListener('change',()=>say(M[+$('#moodR').value][0]));mr();
  // ex6 image pick
  document.querySelectorAll('.dpics').forEach(d=>d.addEventListener('click',e=>{const b=e.target.closest('.pickimg');if(!b)return;d.querySelectorAll('.pickimg').forEach(x=>x.classList.remove('ok','no'));b.classList.add(b.dataset.k===d.dataset.ok?'ok':'no')}));
  // drill 13
  const P=[['John','Anglia','englez'],['Miguel','Portugalia','portughez'],['Umuth','Turcia','turc'],['Thomas','Germania','german'],['Ani','Bulgaria','bulgăroaică'],['Pierre','Franța','francez'],['Sandra','Italia','italiancă'],['Gordana','Slovenia','slovenă'],['Li Yahn','China','chinez'],['Alena','Rusia','rusoaică'],['Marie','Elveția','elvețiancă']];
  let dq=null,shown=false;
  const nd=()=>{const p=P[Math.floor(Math.random()*P.length)];const yes=Math.random()<.5;const c=yes?p[1]:P.filter(x=>x[1]!==p[1])[Math.floor(Math.random()*(P.length-1))][1];dq={p,c,yes};shown=false;rd()};
  const rd=()=>{const {p,c,yes}=dq;$('#drill13').innerHTML=`<div class="bubble q"><span class="ro">– ${p[0]} este din ${c}?</span></div>${shown?`<div class="bubble a"><span class="ro">– ${yes?`Da, e din ${c}.`:`Nu, nu e din ${c}. E din ${p[1]}.`}</span></div>`:''}<div class="row"><button class="btn ghost" id="dShow">${shown?'Дальше →':'Ответить'}</button>${sayBtn(p[0]+' este din '+c+'?')}</div><p class="hint2">Сначала ответьте вслух, потом проверьте. Модель B: <span class="ro">— Nu este coreean? — Ba da, e coreean.</span></p>`};
  $('#drill13').addEventListener('click',e=>{if(e.target.id==='dShow'){if(shown)nd();else{shown=true;rd();say($('#drill13 .bubble.a .ro').textContent.replace('– ',''))}}});nd();
  // days
  const D=['luni','marți','miercuri','joi','vineri','sâmbătă','duminică'];let di=0;
  const rday=()=>{segBtns($('#dayPick'),D.map((d,i)=>[i,d]),di,'day');const g=k=>D[(di+k+7)%7];
   $('#dayLine').innerHTML=[['alaltăieri',-2],['ieri',-1],['azi',0],['mâine',1],['poimâine',2]].map(([l,k])=>`<div class="dl${k===0?' now':''}"><small>${l}</small><span class="ro">${g(k)}</span></div>`).join('');
   $('#dayDlg').innerHTML=[['Ce zi e azi?',`Azi e ${g(0)}.`],['Dar mâine, ce zi e?',`Mâine e ${g(1)}!`],['Și poimâine?',`Poimâine e ${g(2)}.`],['Dar ieri?',`Ieri a fost ${g(-1)}.`]].map(([q,a])=>`<div class="bubble q"><span class="ro">– ${q}</span></div><div class="bubble a"><span class="ro">– ${a}</span></div>`).join('')};
  $('#dayPick').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(b){di=+b.dataset.day;rday();say('Azi e '+D[di])}});rday();
  // prepositions
  const PR=[['pe','Pisica este pe masă.'],['sub','Pisica este sub masă.'],['în','Pisica este în cutie.'],['lângă','Pisica este lângă cutie.'],['între','Pisica este între masă și cutie.']];let pi=0;
  const rp=()=>{segBtns($('#prepPick'),PR.map((p,i)=>[i,p[0]]),pi,'prep');$('#scene').dataset.p=PR[pi][0];$('#prepSent').innerHTML=esc(PR[pi][1]).replace(PR[pi][0],`<span class="art">${PR[pi][0]}</span>`)};
  $('#prepPick').addEventListener('click',e=>{const b=e.target.closest('[data-prep]');if(b){pi=+b.dataset.prep;rp();say(PR[pi][1])}});rp();
 }};

 }};

 {t:'Глаголы на -a',h:'Настоящее время: глаголы на <span class="art">-a</span>',ro:'Verbele în „-a”: a cânta',b:[
  P('Упражнение 5. Завтра суббота, у Феликса концерт в клубе, и он волнуется. Приходит Ани.'),
  {lines:[['Mâine este sâmbătă și Felix are un concert. Cântă într-un club și are emoții. Exersează de câteva zile, repetă fiecare piesă de două ori, apoi înregistrează.','волнуется; репетирует уже несколько дней; повторяет каждую пьесу два раза; записывает'],['Felix: Bună, Ani! — Ani: Bună, Felix! Deranjez? Ce faci?','Я не мешаю?'],['Felix: Exersez de câteva ore, dar nu sunt mulțumit.','Репетирую уже несколько часов, но недоволен.'],['Ani: Exersăm împreună două ore, înregistrăm și apoi ascultăm. De acord?','Давай порепетируем вместе… Согласен?'],['Felix: Da, da, bine! Terminăm până la 7? Am o întâlnire cu Felicia în parc. Alergăm o jumătate de oră și apoi înotăm.','Закончим до семи? У меня встреча с Фелицией.'],['Ani: Unde înotați? În parc? — Felix: Nu, lângă parc, acolo este o piscină.',''],['Ani: A, bine! Și eu am o întâlnire tot la 7. Joc tenis cu Bogdan.','тоже в 7'],['Felix: De când joci tenis? Tu nu joci handbal?','С каких пор ты играешь в теннис?'],['Ani: Pentru handbal, e nevoie de o echipă, pentru tenis am nevoie numai de un partener.','нужна команда… нужен только партнёр'],['Felix: Într-adevăr. E mai simplu în doi. — Ani: Atunci… cântăm?','Действительно. Вдвоём проще. Ну что… поём?']]},
  P('В румынском нет окончания вроде русского «-ть»: словарная форма глагола — это <span class="ro">a</span> + основа (<span class="ro">a cânta</span> — петь). Глаголы делятся на группы по последней гласной: <span class="ro">-a, -ea, -e, -i, -î</span>. У глаголов на <span class="ro">-a</span> <b>форма «он/она» совпадает с формой «они»</b>: <span class="ro">el cântă — ei cântă</span>.'),
  {verbs:[['a cânta','петь, играть',['cân[t]','cân[ți]','cân[tă]','cân[tăm]','cân[tați]','cân[tă]'],'t → ț перед -i: cânt → cânți'],['a alerga','бегать',['aler[g]','aler[gi]','alea[rgă]','aler[găm]','aler[gați]','alea[rgă]'],'e → ea в «он/они»: alerg → aleargă'],['a juca','играть',['jo[c]','jo[ci]','joa[că]','ju[căm]','ju[cați]','joa[că]'],'u → o → oa: joc, joacă, но jucăm'],['a învăța','учить(ся)',['înv[ăț]','înv[eți]','înv[ață]','învă[țăm]','învă[țați]','înv[ață]'],'ă → e → a: învăț, înveți, învață'],['a coborî','спускаться',['cobo[r]','cobo[ri]','coboa[ră]','cobo[râm]','cobo[râți]','coboa[ră]'],'глагол на -î: o → oa в «он/они»'],['a cumpăra','покупать',['cump[ăr]','cump[eri]','cump[ără]','cumpă[răm]','cumpă[rați]','cump[ără]'],'ă → e перед -i']],label:'настоящее время'},
  {note:'Чередования гласных в корне — как в русском «беру — брать»: ударная гласная «расширяется» в формах «он/они»: <span class="ro">e → ea</span> (<span class="ro">aștept → așteaptă</span>), <span class="ro">o → oa</span> (<span class="ro">port → poartă</span>), а перед окончанием <span class="ro">-i</span> согласный смягчается: <span class="ro">t → ț</span>, <span class="ro">s → ș</span>, <span class="ro">st → ști</span> (<span class="ro">cânt → cânți, gust → guști</span>).'},
  {table:{head:['Ещё глаголы на -a','eu','el / ei'],rows:[['a urca — подниматься, садиться (в транспорт)','urc','urcă'],['a termina — заканчивать','termin','termină'],['a spăla — мыть','spăl','spală'],['a discuta — обсуждать','discut','discută'],['a repara — чинить','repar','repară'],['a aștepta — ждать','aștept','așteaptă'],['a purta — носить (одежду)','port','poartă'],['a pleca — уезжать, уходить','plec','pleacă'],['a intra — входить','intru','intră'],['a afla — узнавать','aflu','află'],['a sta — стоять, сидеть, жить','stau','stă']]}},

   X('Упр. 6','Вставьте глагол в нужной форме.',[C('1. Eu termin la ora 8, iar ei {termină} la 9. 2. Eu urc în tramvai, iar ea {urcă} într-un taxi. 3. Eu alerg prin parc, iar ei {aleargă} prin pădure. 4. Eu aștept în stație, iar el {așteaptă} în gară. 5. Eu nu întreb nimic, dar Mirela {întreabă} ceva. 6. Eu plec în oraș, iar Radu {pleacă} la munte. 7. Eu joc handbal, dar ei {joacă} baschet. 8. Eu port o fustă, iar Doina {poartă} pantaloni. 9. Eu cumpăr o revistă, iar ea {cumpără} o carte. 10. Eu învăț limba spaniolă, iar ei {învață} românește. 11. Eu intru la cinema, iar ele {intră} la teatru. 12. Eu stau pe scaun, iar Mihai {stă} pe canapea.')]),
   X('Упр. 7','Раскройте скобки.',[C('Matei este în stație. El {așteaptă§a aștepta} un prieten. Ei {pleacă§a pleca} împreună în vizită la Mihai, un coleg de grupă. Ei {urcă§a urca} într-un taxi. După un sfert de oră, {coboară§a coborî} din taxi. {Sună§a suna} la ușă. Acasă la Mihai sunt mulți băieți și fete. Ei {discută§a discuta} despre muzică și sport. — Felix: Tu {cânți§a cânta} și la pian sau numai la vioară? — Radu: Eu nu sunt muzician, sunt sportiv. — Felix: Scuze! Și ce sport {practici§a practica}? — Radu: {Joc§a juca} baschet și, uneori, volei. Dar tu? — Felix: Eu {învăț§a învăța} limba română și cânt la pian. — Radu: A! Și, în weekend, ce faci? — Felix: {Înot§a înota} în piscină, {alerg§a alerga} prin parc și, bineînțeles, {ascult§a asculta} muzică.')]),
   X('Упр. 8a','Составьте вопрос из слов.',[FILL([['autobuzul / De / aștepți / când?','De când aștepți autobuzul?'],['în / Când / vacanță / pleci?','Când pleci în vacanță?'],['joci / Cu / baschet / sâmbătă / cine?','Cu cine joci baschet sâmbătă?|Sâmbătă cu cine joci baschet?'],['la / Ce / de / cumperi / librărie?','Ce cumperi de la librărie?'],['în / Cine / sală / intră?','Cine intră în sală?'],['acum / înveți / limbă / Ce?','Ce limbă înveți acum?|Acum ce limbă înveți?'],['bucătărie / în / spală / Cine / vase?','Cine spală vase în bucătărie?|Cine spală în bucătărie vase?'],['discutați / ce / Despre?','Despre ce discutați?'],['cânți / Unde / asta / seara / în?','Unde cânți în seara asta?'],['sport / porți / Când / pantofi?','Când porți pantofi sport?'],['unde / De / cobori?','De unde cobori?']])]),
   X('Упр. 8b','Найдите ответ на каждый вопрос.',[M([['De când aștepți autobuzul?','De 15 minute.'],['Când pleci în vacanță?','În iunie.'],['Cu cine joci baschet sâmbătă?','Cu Luca și cu Horia.'],['Ce cumperi de la librărie?','Două caiete și un manual.'],['Cine intră în sală?','Un profesor.'],['Ce limbă înveți acum?','Coreeana.'],['Cine spală vase în bucătărie?','Mama.'],['Despre ce discutați?','Despre arhitectură.'],['Unde cânți în seara asta?','La operă.'],['Când porți pantofi sport?','Când joc tenis.'],['De unde cobori?','De pe munte.']])])])]},

  P('Многие глаголы на <span class="ro">-a</span> в настоящем времени получают суффикс <span class="ro">-ez</span> (в формах «я, ты, он, они»). Сравните с русским: <i>рисовать — рису<b>ю</b></i>, <i>танцевать — танцу<b>ю</b></i> — тоже «лишний» суффикс. Какие глаголы его берут, нужно запоминать: в словаре пишут <span class="ro">a lucra (-ez)</span>.'),

  TABS2([X('Упр. 10','Послушайте разговор молодого курильщика и пожилого господина. Заполните пропуски.',[{html:`<div class="row">${sayBtn('Bună ziua, aveți o țigară? Nu. Nu sunt fumător. Dumneavoastră de ce fumați? Pentru că am prea mult timp liber. De ce nu înotați? E mai sănătos. Nu-mi place apa. Atunci jucați fotbal sau baschet. Nu pot, pentru că n-am prieteni. Atunci vizitați un muzeu! Este imposibil. Nu am niciun ban. Poftiți cinci lei pentru un bilet la muzeu. Vai, mulțumesc, domnule, sunteți drăguț, dar un pachet de țigări costă opt lei.')}<span class="cap">Прослушать</span></div>`},C('Tânărul: Bună ziua, aveți o țigară? — Domnul: Nu. Nu sunt fumător. Dumneavoastră de ce {fumați}? — Tânărul: Pentru că am prea mult timp liber. — Domnul: De ce nu {înotați}? E mai sănătos. — Tânărul: Nu-mi place apa. — Domnul: Atunci {jucați} fotbal sau baschet. — Tânărul: Nu pot, pentru că n-am cu cine. — Domnul: Atunci {vizitați} un muzeu! — Tânărul: Este imposibil. Nu am niciun ban. — Domnul: Poftiți 5 lei pentru un bilet la muzeu… — Tânărul: Vai, mulțumesc, domnule, sunteți drăguț, dar un pachet de {țigări} costă 8 lei.')]),
   X('Упр. 12','Письмо Феликса. Верно (A) или неверно (F)?',[{p:'<span class="ro">Dragă Mihai, Sunt la Sinaia, la munte, de două zile. Este foarte bine aici. Nu am calculator și nu lucrez deloc. Schiez pe zăpadă de dimineața până seara. Mâine vizitez și castelul Peleș. Apoi, am program de dans cu Matei și cu Ioana. Ei dansează în fiecare seară într-un club. Ziua închiriază o sanie sau schiuri și urcă pe munte. În plus, studiază și limba japoneză, pentru că la vară pleacă în Japonia. Sunt foarte mulțumit aici.</span>'},AF4([['Felix este la mare.','F'],['El lucrează mult la calculator.','F'],['Felix vizitează castelul Peleș.','A'],['El dansează împreună cu Matei și cu Ioana.','A'],['Felix studiază limba japoneză.','F']])]),
   X('Упр. 13','Вставьте глагол в правильной форме.',[C('1. Petre exersează la chitară, iar eu {exersez} la pian. 2. Doi pietoni {traversează} strada pe zebră, iar noi traversăm împreună cu ei. 3. Voi nu {fumați}, dar studenții din grupă fumează. 4. Tu lucrezi la o firmă de construcții, iar Mirela {lucrează} la bancă. 5. Maria desenează o casă, iar ei {desenează} un copac. 6. Noi pictăm flori, iar băieții {pictează} animale. 7. Voi dansați la discotecă, dar Claudia nu {dansează} niciodată. 8. Eu întârzii numai zece minute, dar tu {întârzii} o jumătate de oră. 9. Ștefan taie pâine, iar eu {tai} o bucată de cașcaval.')]),
   X('Упр. 14','Раскройте скобки.',[C('Rael și Andreas sunt studenți la Academia de Muzică. Ei {cântă§a cânta} la chitară și, în fiecare zi, {exersează§a exersa} două sau trei ore. Ei nu {fumează§a fuma} și {lucrează§a lucra} serios pentru a progresa. Rachel și Odette sunt studente la Academia de Artă și Design. Ele {desenează§a desena} și {pictează§a picta} în fiecare după-masă, apoi {ascultă§a asculta} muzică până seara, târziu. Uneori, ele {conversează§a conversa} în limba română. Sâmbăta merg la discotecă, unde {dansează§a dansa} până la ora unu noaptea. Ele {pleacă§a pleca} acasă pe la ora două. Duminică {urcă§a urca} în tren și {pleacă§a pleca} în excursie la Sighișoara sau la Sibiu. Rael și Andreas {cumpără§a cumpăra} bilete din gară și împreună {vizitează§a vizita} câteva orașe din România.')]),

 {t:'Где поесть?',h:'Где я сегодня поем?',ro:'Unde mănânc astăzi?',b:[
  {html:`<div class="tbl-wrap"><table><thead><tr><th>Меню a</th><th>Меню b</th><th>Меню c</th></tr></thead><tbody><tr><td class="ro">ciorbă de cartofi — 3 lei<br>supă de pui — 3,20 lei<br>sarmale — 3 lei<br>tocană de legume — 4,20 lei<br><i>desert:</i> mere — 0,20 lei; budincă de ciocolată — 1,80 lei<br><i>băuturi:</i> apă carbogazoasă — 1,20 lei; suc — 2 lei; cafea — 1 leu; ceai — 0,70 lei</td><td class="ro">hamburger — 2,50 lei<br>cheeseburger — 3,80 lei<br>cartofi pai — 1,80 lei<br>salată — 4 lei<br><i>desert:</i> înghețată de ciocolată — 1,90 lei; prăjituri cu cremă de vanilie — 1,80 lei<br><i>băuturi:</i> apă carbogazoasă — 1,50 lei; suc — 2,20 lei; cafea — 1,70 lei; shake — 3 lei</td><td class="ro">pizza Primavera — 4 lei<br>pizza vegetariană — 3,80 lei<br>paste cu sos de roșii — 4,60 lei<br><i>desert:</i> prăjituri cu ciocolată — 1,30 lei; budincă de vanilie — 0,90 lei<br><i>băuturi:</i> apă plată — 1,80 lei; suc — 2,40 lei; cafea — 1,80 lei</td></tr></tbody></table></div>`},
  {p:'<span class="ro">Felix mănâncă în fiecare zi în oraș. Știe deja ce meniu este la pizzerie, la fast food și la cantină. Astăzi, el nu are chef de supă sau ciorbă, dorește numai niște legume și un desert cu ciocolată. De obicei, după masă ia un suc.</span> <span class="muted">— Сегодня Феликсу не хочется супа, он хочет только овощей и шоколадный десерт; после еды обычно пьёт сок.</span>'},
  {chips:[['ciorbă','кислый суп'],['tocană de legume','овощное рагу'],['cartofi pai','картофель фри'],['apă plată','вода без газа'],['apă carbogazoasă','газированная вода'],['budincă','пудинг']]},
  TABS2([X('Упр. 6','Какое меню для какого места?',[LET([['meniul a','cantină'],['meniul b','fast food'],['meniul c','pizzerie']],['pizzerie','fast food','cantină'])]),
   X('Упр. 7b','Сколько стоит? (студенты A, B, C)',[FILL([['A: Cât costă tocana de legume?','4,20 lei|4,20|4.20 lei|4.20'],['A: Cât costă budinca de ciocolată?','1,80 lei|1,80|1.80'],['A: Cât costă sucul?','2 lei|2|doi lei'],['A: TOTAL','8 lei|8,00 lei|8|8,00'],['B: Cât costă cartofii pai și salata?','5,80 lei|5,80|5.80'],['B: Cât costă înghețata de ciocolată?','1,90 lei|1,90|1.90'],['B: Cât costă sucul?','2,20 lei|2,20|2.20'],['B: TOTAL','9,90 lei|9,90|9.90'],['C: Cât costă pizza vegetariană?','3,80 lei|3,80|3.80'],['C: Cât costă prăjiturile cu ciocolată?','1,30 lei|1,30|1.30'],['C: Cât costă sucul?','2,40 lei|2,40|2.40'],['C: TOTAL','7,50 lei|7,50|7.50']])]),
   X('Упр. 7c','Где ест Феликс?',[C('Felix mănâncă la {pizzerie}, pentru că acolo găsește pizza vegetariană, prăjitură cu {ciocolată} și suc, iar prețul total este de {7,50|7.50} lei.')])])]},
 {t:'Определённый артикль',h:'Определённый артикль',ro:'Articolul definit',b:[
  P('В русском артиклей нет. В румынском, кроме неопределённого <span class="ro">un / o</span> («какой-то, один»), есть <b>определённый артикль</b> — «тот самый, известный, вообще». Он <b>присоединяется к концу слова</b>: <span class="ro">un măr</span> «(какое-то) яблоко» → <span class="ro">mărul</span> «(это) яблоко». Так же устроено в болгарском и шведском.'),
  {table:{head:['Род','Ед. ч.','Мн. ч.'],rows:[['мужской: -(u)l / -i','cartof[ul], pui[ul], metr[ul]','cartofi[i], pui[i], metri[i]'],['мужской на -e: + le','frate[le], câine[le], soare[le]','frați[i], câini[i]'],['женский: -a (ă → a, e → ea)','sup[a], femei[a], bere[a]','supe[le], femei[le], beri[le]'],['женский на -ea: -ua','cafea[ua], stea[ua]','cafele[le], stele[le]'],['средний: -(u)l / -le','vin[ul], teatr[ul], taxi[ul]','vinuri[le], teatre[le], taxiuri[le]'],['средний на -e: + le','lapte[le], nume[le]','nume[le], prenume[le]']]}},
  P('Нажмите на карточку — к слову присоединится артикль.'),
  {morph:[['cartof','cartoful','картофель'],['frate','fratele','брат'],['câine','câinele','собака'],['om','omul','человек'],['supă','supa','суп'],['bere','berea','пиво'],['femeie','femeia','женщина'],['cafea','cafeaua','кофе'],['vin','vinul','вино'],['taxi','taxiul','такси'],['lapte','laptele','молоко'],['cartofi','cartofii','картошка (мн.)'],['supe','supele','супы'],['vinuri','vinurile','вина']]},
  {h:'Когда артикль нужен, а когда нет'},
  {table:{head:['Артикль нужен','Артикля нет'],rows:[['подлежащее: [Studenții] sunt la cantină. [Mâncarea] este în farfurie.','mult / puțin + сущ.: Este [mult lapte] în frigider.'],['amândoi, amândouă + сущ.: [Amândoi colegii] sunt la masă.','cât, câtă, câți, câte + сущ.: [Câtă pâine] cumperi?'],['tot, toată, toți, toate + сущ.: Mănânc [toată mâncarea].','число + сущ.: [trei farfurii], [doi litri] de lapte'],['a-i plăcea + сущ.: Îmi place [înghețata]. Îți plac [merele]?','fiecare + сущ.: [fiecare client]'],['cu + транспорт, инструмент: cu [trenul], cu [lingura]','предлог + сущ.: Este bere în [frigider]. Găsești unt la [magazin].']]},roFirst:true},
  {note:'Но предлог + существительное с артиклем, если есть уточнение: <span class="ro">Sunt student la facultate</span>, но <span class="ro">Sunt student la Facultatea de Litere</span>.'},
  TABS2([X('Упр. 9 · род','К какой группе относится слово?',[PICK([['copil','m.'],['președinte','m. (-e)'],['femeie','f.'],['copac','m.'],['câine','m. (-e)'],['ingineră','f.'],['pijama','f. (-a)'],['perdea','f. (-a)'],['om','m.'],['burete','m. (-e)'],['sală','f.'],['suc','n.'],['tramvai','n.'],['taxi','n.'],['stea','f. (-a)']],['m.','m. (-e)','f.','f. (-a)','n.'])]),
   X('Упр. 9 · артикль','Напишите слово с определённым артиклем (ед. ч.).',[FILL([['copil','copilul'],['președinte','președintele'],['femeie','femeia'],['copac','copacul'],['câine','câinele'],['ingineră','inginera'],['pijama','pijamaua'],['perdea','perdeaua'],['om','omul'],['burete','buretele'],['sală','sala'],['suc','sucul'],['tramvai','tramvaiul'],['taxi','taxiul'],['stea','steaua']])]),
   X('Упр. 10','Множественное число с определённым артиклем.',[FILL([['copil','copiii'],['președinte','președinții'],['femeie','femeile'],['copac','copacii'],['câine','câinii'],['ingineră','inginerele'],['pijama','pijamalele'],['perdea','perdelele'],['om','oamenii'],['burete','bureții'],['sală','sălile'],['suc','sucurile'],['tramvai','tramvaiele'],['taxi','taxiurile'],['stea','stelele']])]),
   X('Упр. 11','Допишите артикль.',[C('1. Cumpăr un suc. Suc{ul} e de mere. 2. Doresc niște biscuiți. Biscuiț{ii} costă 2 lei. 3. Este cald. Soare{le} este pe cer. 4. Cumpăr o bere. Bere{a} este de la frigider. 5. Sunt cinci scaune lângă masă. Scaune{le} sunt pentru voi. 6. Avem paste la cină. Paste{le} sunt cu brânză. 7. Mănânc o prăjitură. Prăjitur{a} este cu fructe. 8. Comand niște cartofi. Doresc cartof{ii} cu o salată.')]),
   X('Упр. 12 · пример ответа','Продолжите по образцу: Este o masă. Masa este plină cu mâncare. '+pg(83),[{lines:[['Este o salată. Salata este în bol.',''],['Sunt niște farfurii. Farfuriile sunt albe.',''],['Sunt niște tacâmuri. Tacâmurile sunt lângă farfurii.','столовые приборы'],['Este o față de masă. Fața de masă este albă.','скатерть'],['Sunt două șervețele. Șervețelele sunt lângă salată.','салфетки'],['Este un platou rotund. Platoul rotund este lângă farfurii.','круглое блюдо']]}]),
   X('Упр. 13 (ответы составлены редактором)','Список покупок Феликса: к какой группе относится продукт и как он звучит с артиклем?',[PICK([['2 kg de mere','fructe'],['un litru de lapte','produse lactate'],['două cutii de iaurt','produse lactate'],['un kg de roșii','legume'],['trei cepe','legume'],['o pâine','produse de brutărie'],['1 kg de banane','fructe'],['un pachet de unt','produse lactate'],['două cornuri','produse de brutărie'],['un ananas','fructe'],['două kg de cartofi','legume'],['doi covrigi','produse de brutărie']],['legume','produse lactate','fructe','produse de brutărie']),FILL([['mere →','merele'],['lapte →','laptele'],['iaurt →','iaurtul'],['roșii →','roșiile'],['cepe →','cepele'],['pâine →','pâinea'],['banane →','bananele'],['unt →','untul'],['cornuri →','cornurile'],['ananas →','ananasul'],['cartofi →','cartofii'],['covrigi →','covrigii']])])])]},
 {t:'Mult / puțin',h:'Много и мало: <span class="art">mult / puțin</span>',ro:'Ce mâncăm în România?',b:[
  {table:{head:['','мужской / средний ед.','женский ед.','мужской мн.','женский / средний мн.'],rows:[['много','[mult] orez','[multă] cafea','[mulți] castraveți','[multe] pere'],['мало','[puțin] vin','[puțină] apă','[puțini] cartofi','[puține] fructe']]}},
  {note:'<span class="ro">mult / puțin</span> согласуются с существительным, как русские прилагательные, а существительное после них — <b>без артикля</b>: <span class="ro">Astăzi gătesc mult orez. Am, pentru voi, multă cafea.</span> Средний род в ед. ч. — как мужской, во мн. ч. — как женский.'},
  P('Упражнение 15. Румынская кухня.'),
  {lines:[['În România, oamenii gătesc, în general, foarte bine. Turiștii mănâncă aici cu plăcere mămăligă, sarmale sau plăcinte.','мамалыга (кукурузная каша), голубцы, пироги'],['Sunt și vizitatori care spun că românii folosesc, în mâncare, o cantitate foarte mare de carne și condimente în exces (sare, piper, boia de ardei). Gustul este excelent, dar unele ingrediente nu sunt foarte sănătoase.','мясо, приправы (соль, перец, паприка)'],['Meridionalii nu sunt foarte mulțumiți când nu găsesc aici fructe de mare proaspete, iar chinezii și japonezii observă imediat că orezul nu este, din păcate, un ingredient important în bucătăria noastră. În loc de orez, gătim în special cartofi.','южане; свежие морепродукты; вместо риса'],['Românii nu beau cantități mari de vin sau de bere, pentru că preferă țuica, mai ales în zonele din nord. Este bună și țuica de mere sau de caise, dar țuica de prune e perfectă. Atenție, însă! E o băutură foarte tare, cu un conținut extrem de mare de alcool.','цуйка — сливовая водка; очень крепкий напиток'],['Deserturile românești tradiționale sunt delicioase. Nu mâncați foarte multe, însă. Ingredientul principal este făina, deci riscați niște kilograme în plus. E adevărat, când sunt făcute cu fructe (mere, caise, nuci, prune), cozonacii, prăjiturile și plăcintele sunt irezistibile.','мука; рискуете лишними килограммами; кулич (козонак)']]},
  TABS2([X('Упр. 14','Соедините слова и картинки. '+pg(85),[LET([['sarmale','b'],['mămăligă','a'],['carne','g'],['condimente','f'],['plăcinte','h'],['orez','e'],['cartofi','c'],['cozonac','d']],['a','b','c','d','e','f','g','h'])]),
   X('Упр. 15','Верно (A) или неверно (F)?',[AF5([['Românii folosesc multe condimente.','A'],['În România, oamenii mănâncă puțin orez.','A'],['Românii beau multă bere.','F'],['Oamenii din România beau puțină țuică.','F'],['Țuica din România conține puțin alcool.','F'],['Deserturile românești conțin multă făină.','A']])]),
   X('Упр. 16','Послушайте: много или мало?',[{html:`<div class="row">${sayBtn('Ana, bei cafea în fiecare dimineață? Da, beau cafea multă, și dimineața, și după-masa. Uneori beau și ceai, dar destul de puțin.')}<span class="cap">1</span>${sayBtn('Mario, mănânci fructe de mare în România? Aici, fructele de mare costă mult și mănânc puține fructe de mare. Dar este pizza foarte bună în România. Mănânc multă pizza, cu diferite ingrediente.')}<span class="cap">2</span>${sayBtn('Hiroaki, ce mănânci în România? Eu mănânc, ca de obicei, mult orez. Dar găsești ușor orez aici? Nu, la cantină și la restaurant nu găsesc mult orez. Dar gătesc eu acasă orez. Românii preferă cartofi, dar eu mănânc puțini cartofi.')}<span class="cap">3</span>${sayBtn('Marlise, mănânci multe dulciuri în România? Da, mănânc în special înghețată. Vara prefer înghețata, când e foarte cald. Dar prăjiturile cum sunt aici? Sunt foarte bune, dar nu mănânc prea multe pentru că au o cantitate foarte mare de zahăr.')}<span class="cap">4</span></div>`},PICK([['Ana: cafea','mult'],['Ana: ceai','puțin'],['Mario: fructe de mare','puțin'],['Mario: pizza','mult'],['Hiroaki: orez','mult'],['Hiroaki: cartofi','puțin'],['Marlise: înghețată','mult'],['Marlise: prăjituri','puțin']],['mult','puțin'])]),
   X('Упр. 17','Выберите правильный вариант.',[PK5([['a1. Consumați în fiecare zi … vin',['puțin','puțini'],'puțin'],['a2. beți vin natural, cu … alcool',['puțin','puțini'],'puțin'],['a3. Vinul are … vitamine',['multă','multe'],'multe'],['a4. el ajută corpul în … probleme de sănătate',['multă','multe'],'multe'],['b1. Oamenii consumă ceai de foarte … vreme',['multă','multe'],'multă'],['b2. un tratament în … situații',['multă','multe'],'multe'],['b3. Beți ceaiul cu … lapte de soia',['puțin','puțini'],'puțin']])]),
   X('Упр. 18','Поставьте слово в нужную форму.',[C('Doctorii spun că fructele sunt foarte bune pentru sănătate. Dacă mâncăm {multe§mult} fructe, avem energie și o stare generală bună. De asemenea, dacă bem {multă§mult} apă, hidratăm corpul, care elimină ușor toxinele. {Puțină§puțin} cafea dimineața și {mult§mult} ceai în fiecare zi sunt foarte utile.')])])]},
 {t:'Tot, toată · amândoi',h:'Весь, вся, все · оба, обе',ro:'tot, toată, toți, toate · amândoi, amândouă',b:[
  {table:{head:['','ед. ч.','мн. ч.','Пример'],rows:[['мужской','[tot]','[toți]','Beau [tot] ceaiul. Mănânc [toți] castraveții.'],['женский','[toată]','[toate]','[Toată] apa este în pahare. Spăl [toate] merele.'],['оба / обе','—','[amândoi] / [amândouă]','[Amândoi] clienții mănâncă pizza. [Amândouă] farfuriile sunt pe masă.']]},roFirst:false},
  {note:'После <span class="ro">tot, toată, toți, toate</span> и <span class="ro">amândoi, amândouă</span> существительное всегда <b>с артиклем</b>: «весь <i>этот</i> чай» — <span class="ro">tot ceaiul</span>, «обе <i>эти</i> тарелки» — <span class="ro">amândouă farfuriile</span>. Средний род во мн. ч. — женские формы: <span class="ro">toate paharele, amândouă caietele</span>.'},
  TABS2([X('Упр. 20','Посмотрите на картинку. Верно (A) или неверно (F)? '+pg(87),[AF5([['În toate paharele este vin.','F'],['Lângă toate farfuriile sunt tacâmuri.','A'],['Toate farfuriile sunt albe.','A'],['Amândouă fețele de masă sunt albe.','F'],['Amândouă salatele sunt în boluri.','A']])]),

  {html:`<div class="row">${sayBtn('Carla, Italia. De ce locuiesc cu părinții mei? E foarte comod. Lucrez mult, vin acasă târziu și mama gătește pentru mine. Ea e pensionară, e tot timpul acasă. Cosmin, România. Sunt încă student și, în București, un apartament e foarte scump. Stau cu părinții și cu fratele meu, Paul. El e la liceu. Pentru moment, e bine așa. Maria, Grecia. Nu îmi place deloc să stau singură. Prefer să stau cu părinții mei acum și cu sora mea, Doris. Eu și Doris ieșim mult împreună și așa nu mă plictisesc deloc.')}<span class="cap">Упр. 9c: Карла, Космин и Мария — почему они живут с родителями</span></div>`},

 {t:'Воронец',h:'Особый цвет',ro:'O culoare specială',b:[
  {lines:[['Dacă vrei să fii turist în Europa, cauți, de obicei, locuri vechi, importante pentru țara în care mergi, pentru istoria ei.','старинные места'],['Acestea sunt remarcabile, în general, nu doar prin vechimea, [ci] și prin frumusețea lor.','не только древностью, но и красотой'],['România are și ea locuri intens vizitate de turiști. De exemplu, Bucovina, zona din nord-estul României, are toate argumentele necesare pentru a face parte din orice plan de vacanță.','северо-восток Румынии'],['Găsești aici un peisaj montan splendid, sate tradiționale românești, dar și produse artistice de foarte mare valoare.','великолепный горный пейзаж'],['Numeroși turiști merg în Bucovina pentru a vizita mănăstirile de acolo. Multe dintre ele sunt incluse în patrimoniul UNESCO.','монастыри'],['Una dintre aceste mănăstiri este Voroneț, care se găsește la 36 de kilometri de orașul Suceava. Ea datează din anul 1488.','датируется 1488 годом'],['Un element artistic important este pictura interioară și exterioară, în special culoarea ei principală, cunoscută ca „albastru de Voroneț”.','«воронецкая синь»'],['Mănăstirea este numită uneori „Capela Sixtină din România”, pentru că pictura ei este considerată foarte valoroasă.',''],['Sunt însă istorici care spun că nu putem compara acest monument cu ceva din altă țară. El e deosebit exact prin faptul că este unic.','уникален'],['Indiferent dacă aveți impresia că seamănă cu un alt loc istoric sau nu, o excursie la Voroneț este o idee excelentă.','похож']]},

  {lines:[['1. Echipa de olimpici români a mers, săptămâna trecută, la Concursul Internațional de Matematică de la Madrid. Tinerii au câștigat, anul acesta, 2 medalii de aur și trei de argint. Echipa a terminat concursul pe locul doi. Au revenit în țară ieri după-amiaza și s-au întâlnit la aeroport cu familiile, colegii și profesorii lor.','на прошлой неделе · золотые и серебряные медали · вернулись · встретились'],['2. La Olimpiada de vară de la Sidney, atleta româncă Gabriela Szabo a câștigat medalia de aur la cursa de 5000 de metri. Gabi Szabo a câștigat, numai anul trecut, două medalii de aur la Campionatul mondial de atletism și o medalie de argint la Campionatul european.','забег на 5000 м · только в прошлом году'],['3. Acum două zile, la intersecția Șapte străzi, a avut loc un accident de circulație. Din fericire, nu au fost victime. Poliția a declarat că amândoi conducătorii au fost vinovați pentru accident și au primit o amendă.','два дня назад · произошло ДТП · к счастью · оба водителя виновны · штраф'],['4. Echipa de astronauți ruși a plecat ieri într-o nouă expediție pe lună. În urmă cu doi ani, echipa de astronauți a stat aproape șase luni pe lună. Când au revenit acasă, căpitanul a declarat: „Am nevoie de o vacanță lungă împreună cu copiii și soția mea.”','два года назад · почти шесть месяцев'],['5. Ieri, 21 martie, primarul a deschis noul spital de urgență din orașul nostru. Primăria a primit o sumă importantă de bani de la guvern, pentru a termina construcția. Spitalul nou este cel mai modern spital de urgență din România.','мэр открыл новую больницу скорой помощи · мэрия · правительство']]},
  {table:{head:['Перевод','Выражение'],rows:[['вчера · позавчера','ieri · alaltăieri'],['вчера вечером · сегодня утром','aseară · azi-dimineață'],['на прошлой неделе / в прошлом месяце / прошлым летом / прошлой зимой','săptămâna / luna / vara / iarna [trecută]'],['в прошлом году','anul [trecut]'],['два часа / два дня / месяц назад','[acum] două ore / două zile / o lună'],['два дня назад · два года назад','[cu] două zile [în urmă] · [în urmă cu] doi ani']]}},

 {t:'Perfectul compus',h:'Прошедшее время: <span class="art">perfectul compus</span>',ro:'Verbul: perfectul compus',b:[
  P('В румынском основное разговорное прошедшее время — <span class="ro">perfectul compus</span> («составное прошедшее»). Оно строится как в английском <i>I have done</i> или немецком <i>ich habe gemacht</i>: <b>вспомогательный глагол + причастие</b>. В отличие от русского, вид (сделал / делал) и род (сделал / сделала) не различаются: <span class="ro">am citit</span> = «я читал(а)» и «я прочитал(а)».'),
  {formula:[['вспомогательный','am · ai · a · am · ați · au','краткие формы от a avea'],['+ причастие','citit, mers, făcut…','не меняется'],['отрицание','nu am citit = n-am citit','nu a = n-a']]},
  {verbs:[['a lucra','работать',['[am] lucrat','[ai] lucrat','[a] lucrat','[am] lucrat','[ați] lucrat','[au] lucrat'],'Обратите внимание: 3-е лицо ед. ч. — <span class="ro">a</span>, а не <span class="ro">are</span>; 1-е и 2-е мн. ч. — <span class="ro">am, ați</span>, а не <span class="ro">avem, aveți</span>.'],['a nu merge','не идти',['nu am mers · [n-am] mers','nu ai mers · [n-ai] mers','nu a mers · [n-a] mers','nu am mers · [n-am] mers','nu ați mers · [n-ați] mers','nu au mers · [n-au] mers']],['a se trezi','проснуться',['[m-am] trezit','[te-ai] trezit','[s-a] trezit','[ne-am] trezit','[v-ați] trezit','[s-au] trezit'],'Возвратное местоимение сливается со вспомогательным глаголом через дефис.'],['a fi','быть',['am [fost]','ai [fost]','a [fost]','am [fost]','ați [fost]','au [fost]']]]},
  {table:{head:['Группа (инфинитив)','Причастие','Примеры'],rows:[['I · -a','[-at]','a termina → terminat · a cânta → cântat · a asculta → ascultat'],['II · -ea','[-ut]','a putea → putut · a părea → părut · a vedea → văzut'],['III · -e','[-ut] / [-s] / [-t]','a face → făcut · a cere → cerut · a crede → crezut · a merge → mers · a spune → spus · a deschide → deschis · a sparge → spart · a fierbe → fiert · a rupe → rupt'],['IV · -i / -î','[-it] / [-ât]','a citi → citit · a dormi → dormit · a plăti → plătit · a hotărî → hotărât'],['неправильные','—','a fi → [fost] · a ști → [știut] · a bea → [băut] · a vrea → [vrut] · a lua → [luat]']]}},
  {html:'<div class="drill" id="u9pc"><p class="cap" style="text-align:left">Конструктор: выберите глагол и лицо — получите форму прошедшего времени.</p><div class="row" style="flex-wrap:wrap;gap:8px"><select class="sel2" id="u9pcV" aria-label="Глагол"></select><select class="sel2" id="u9pcP" aria-label="Лицо"></select><label class="row" style="gap:6px"><input type="checkbox" id="u9pcN"> отрицание</label></div><div class="ro big3" id="u9pcO"></div><div class="row" id="u9pcS"></div></div>'},

 {t:'Conjunctivul',h:'Сослагательное наклонение: <span class="art">să</span> + глагол',ro:'Conjunctivul prezent',b:[

  {formula:[['1-е и 2-е лицо, мн. ч.','să + настоящее время','eu să termin · noi să terminăm'],['3-е лицо (он/они)','особая форма','el să termine · ei să termine'],['возвратные','să + mă/te/se… + глагол','să mă plimb · să se plimbe']]},
  {verbs:[['a termina','заканчивать',['să termin','să termini','să [termine]','să terminăm','să terminați','să [termine]'],'Для сравнения, настоящее время: <span class="ro">el termină</span> → <span class="ro">să termine</span>.'],['a se plimba','гулять',['să mă plimb','să te plimbi','să se [plimbe]','să ne plimbăm','să vă plimbați','să se [plimbe]']],['a citi','читать',['să citesc','să citești','să [citească]','să citim','să citiți','să [citească]']],['a fi','быть',['să [fiu]','să [fii]','să [fie]','să [fim]','să [fiți]','să [fie]'],'Особенно часто: <span class="ro">trebuie să fie</span> — должно быть.'],['a avea','иметь',['să am','să ai','să [aibă]','să avem','să aveți','să [aibă]']]],label:'vreau / vrei / vrea…'},
  {table:{head:['Правило для 3-го лица','Настоящее → конъюнктив'],rows:[['-ă → -e','el termină → să [termine] · el coboară → să [coboare]'],['-ează → -eze','el lucrează → să [lucreze]'],['-e → -ă','el face → să [facă] · el poate → să [poată] · el doarme → să [doarmă]'],['-ește → -ească','el plătește → să [plătească]']]}},
  {table:{head:['Чередование гласных','Примеры'],rows:[['e → ea','merge → să [meargă] · cere → să [ceară] · începe → să [înceapă]'],['ă → e','cumpără → să [cumpere] · numără → să [numere]'],['ea → e','așteaptă → să [aștepte] · pleacă → să [plece] · încearcă → să [încerce]'],['a → e','învață → să [învețe] · spală → să [spele]'],['e → a','vede → să [vadă] · pierde → să [piardă]'],['ie → ia','iese → să [iasă]']]}},
  {morph:[['el știe','să știe','знает','🧠'],['el scrie','să scrie','пишет','✍️'],['el bea','să bea','пьёт','🥤'],['el ia','să ia','берёт','🤲'],['el dă','să dea','даёт','🎁'],['el stă','să stea','стоит, живёт','🪑'],['el are','să aibă','имеет','👜'],['el este','să fie','есть','✅'],['el vrea','să vrea','хочет','💭'],['el mănâncă','să mănânce','ест','🍽️']]},
  {note:'Неправильные глаголы: у <span class="ro">a da, a sta, a avea, a fi</span> форма 3-го лица в конъюнктиве совсем другая (<span class="ro">dă → să dea, are → să aibă, este → să fie</span>). Глаголы на <span class="ro">-ie, -ea, -ia</span> (<span class="ro">știe, bea, ia</span>) не меняются.'},
  TABS2([X('Упр. 6','Поставьте глагол в скобках в правильную форму.',[FILL([['Marius știe … chinezește. (a scrie)','să scrie'],['Șoferul încearcă … mașina lângă hotel. (a parca)','să parcheze'],['Vecina mea vrea … o apă plată. (a bea)','să bea'],['Lui Virgil nu-i place … autobuzul. (a aștepta)','să aștepte'],['Soția ta s-a plictisit … toată ziua vase. (a spăla)','să spele'],['El uită întotdeauna … pâine. (a cumpăra)','să cumpere'],['Mama nu poate … că pleacă în America. (a crede)','să creadă'],['Prietenii mei au hotărât … în excursie. (a merge)','să meargă'],['E greu … într-un tramvai aglomerat. (a sta)','să stea'],['Fratele meu se duce la bancă … factura de gaz. (a plăti)','să plătească']])]),
   X('Упр. 7','Мастер на все руки. Глаголы: a schimba, a ajuta, a duce, a trata, a se uita, a repara, a se plimba, a face.',[C('Pavel este un meșter foarte priceput. Știe {să facă} de toate. De exemplu, poate {să repare} orice aparat electrocasnic. Toți vecinii apelează la el când au nevoie de un depanator. … Dacă mergi cu mașina și faci pană, nu e nicio problemă. Pavel știe {să schimbe} roata. Și nu este nici electrician, nici mecanic. Este antrenor de baschet. Dar îi place {să ajute} oamenii: așa este el. Seara, preferă {să se uite} la televizor, la meciuri de baschet sau de fotbal, sau {să se plimbe} în parc cu câinele lui preferat, Lupu. Într-o seară, Lupu a găsit o pisică bolnavă în parc, iar Pavel a trebuit {să ducă} pisica la doctor. Din păcate, nu se pricepe {să trateze} pisici.')]),
   X('Упр. 9a','Джордже Энеску. Послушайте и заполните пропуски.',[{html:`<div class="row">${sayBtn('La 19 august 1881, se naște George Enescu, un român foarte cunoscut. La vârsta de numai 4 ani, el știe deja să citească și să scrie. Toată lumea este de acord că George este un copil foarte special, un copil-minune. Tot la vârsta de 4 ani, începe să cânte la vioară, iar la 5 ani are deja primul său concert. Între anii 1888 și 1894, studiază la Conservatorul din Viena. La 12 ani, poate să interpreteze în concert piese de Johannes Brahms, care au mare succes la publicul și presa din Viena. Termină Conservatorul din Viena cu medalia de argint, apoi continuă să studieze la Conservatorul din Paris. În ziua de 6 februarie 1898, debutează și în calitate de compozitor. Tot atunci, începe să dea lecții de vioară la București, să susțină recitaluri de vioară. În primii ani din secolul XX, scrie cele mai cunoscute compoziții: cele două Rapsodii române și prima sa Simfonie. Din 1915, organizează la București un concurs de compoziție George Enescu, în care oferă premii pentru tinerii creatori români. Acest concurs continuă și astăzi.')}<span class="cap">Прослушать</span></div>`},C('La 19 august 1881, {se naște} George Enescu, un român foarte cunoscut. La vârsta de numai 4 ani, el știe deja {să citească} și să scrie. Toată lumea este de acord că George este un copil foarte special, un „copil-minune”. Tot la vârsta de 4 ani, începe {să cânte} la vioară, iar la 5 ani are deja primul său concert. Între anii 1888 și 1894, studiază la Conservatorul din Viena. La 12 ani, poate {să interpreteze} în concert piese de Johannes Brahms, care au mare succes la publicul și presa din Viena. Termină Conservatorul din Viena cu medalia de argint, apoi continuă {să studieze} la Conservatorul din Paris. În ziua de 6 februarie 1898, debutează și în calitate de compozitor. Tot atunci, începe {să dea} lecții de vioară la București, să susțină recitaluri de vioară. Este invitat să țină concerte și la Castelul Peleș, din Sinaia, pentru Regina Elisabeta, care scrie și poezii sub numele de Carmen Sylva. În primii ani din secolul XX, {scrie} cele mai cunoscute compoziții: cele două Rapsodii române (1901–1902) și prima sa Simfonie (1905). Face multe turnee la Paris și în alte țări europene. Din 1915, {organizează} la București un concurs de compoziție George Enescu, în care oferă premii pentru tinerii creatori români.')]),
   X('Упр. 9b','Верно (A) или неверно (F)?',[PICK([['George Enescu s-a născut în secolul XX.','F'],['Începe să compună muzică la vârsta de 5 ani.','F'],['Dă lecții de vioară din anul 1898.','A'],['Carmen Sylva este numele de poetă pentru Regina Elisabeta.','A'],['După 1900, se stabilește definitiv la Paris.','F']],['A','F'])])])]},

  TABS2([X('Упр. 11a','Вакансии по радио. Послушайте и заполните пропуски.',[{html:`<div class="row">${sayBtn('Aici restaurantul Mama Sia. Ești harnic și rapid? Știi să gătești mâncare tradițională românească? Dacă vrei să fii bucătarul nostru, trebuie să vii la noi și să faci o porție de sarmale și o ciorbă de burtă! Dacă mâncarea ta va fi gustoasă, de mâine poți să începi lucrul. Vrei să fii dansator profesionist? Atunci trebuie să vii la Clubul Euforia, pe strada Napoca, numărul 100. Trebuie să dai o probă de dans și poți începe chiar în seara asta. Nu aștepta prea mult! Avem numai un post liber. Bună ziua! Aici firma de construcții Viitorul. Sunteți o persoană serioasă? Ați terminat Facultatea de Construcții? Atunci sunteți omul perfect pentru postul de inginer constructor. Dar, atenție! Candidatul nostru trebuie să aibă și experiență de lucru pe șantier. Oferim un salariu atractiv și două mese gratuite în fiecare zi.')}<span class="cap">Прослушать</span></div>`},C('A. Aici restaurantul „Mama Sia”. Ești harnic și rapid? Știi {să gătești} mâncare tradițională românească? Dacă vrei să fii {bucătarul} nostru, trebuie să vii la noi și {să faci} o porție de sarmale și o ciorbă de burtă! Dacă mâncarea ta va fi gustoasă, de mâine {poți} să începi lucrul. B. Vrei {să fii} dansator profesionist? Atunci trebuie să vii la Clubul Euforia, pe strada Napoca, nr. 100. Trebuie {să dai} o probă de dans și poți începe chiar în seara asta. C. Bună ziua! Aici firma de construcții „Viitorul”. Sunteți o persoană serioasă? Ați terminat Facultatea de {Construcții}? Atunci sunteți omul perfect pentru postul de {inginer} constructor. Dar, atenție! Candidatul nostru trebuie {să aibă} și experiență de lucru pe șantier. Oferim un {salariu} atractiv și două mese gratuite în fiecare zi.')])]),

  {lines:[['Doamna: Bună ziua, hai să facem cunoștință! Eu sunt Mioara Adam. Dumneavoastră?','давайте познакомимся'],['Vasile: Încântat! Eu sunt Vasile Crăciun.','очень приятно'],['Doamna: Călătoriți des cu trenul?',''],['Vasile: Destul de des, dar nu-mi place să călătoresc. Prefer să stau acasă.','мне не нравится путешествовать'],['Doamna: Dar ce profesie aveți?',''],['Vasile: Am fost mecanic de locomotivă, dar acum sunt șomer.','машинист локомотива · безработный'],['Doamna: A! Înțeleg de ce nu vă place să călătoriți. Și ce faceți toată ziua acasă? Nu vă plictisiți?','не скучаете?'],['Vasile: N-am timp să mă plictisesc. Soția mea lucrează de dimineața până seara, iar eu trebuie să fac totul în casă.','мне некогда скучать'],['Doamna: Soția dumneavoastră trebuie să fie foarte fericită.','должно быть, очень счастлива'],['Vasile: Aveți dreptate. Mă străduiesc să fiu un soț model. Îmi place să gătesc, să spăl vase, să scot câinele la plimbare, să conversez cu soacra mea, dar trebuie să recunosc, nu suport să calc cămăși.','стараюсь быть образцовым мужем · с тёщей · терпеть не могу гладить рубашки'],['Doamna: Văd că știți, într-adevăr, să faceți o mulțime de lucruri. Eu sunt femeie, dar nu mă pricep la treburi casnice. Uneori am chef și eu să gătesc.','не разбираюсь в домашних делах'],['Vasile: Și cum iese mâncarea?','и как получается еда?'],['Doamna: Toată lumea spune că e bună, dar eu nu sunt prea convinsă.',''],['Vasile: Sunt sigur că sunteți modestă.','вы скромничаете'],['Doamna: Credeți? Atunci, hai să gustați ceva, dacă sunteți curajos. Am puțin cozonac la pachet.','попробуйте · кулич (сладкий хлеб) с собой'],['Vasile: Îmi pare foarte rău, nu mănânc niciodată cozonac fără să beau ceai.','не запив чаем'],['Doamna: Nu puteți scăpa! Am și un termos cu ceai.','вам не отвертеться!'],['Vasile: Nu vă deranjați!','не беспокойтесь'],['Doamna: Nu-i niciun deranj. Insist să gustați și să apreciați. Trebuie să fiți sincer!','настаиваю'],['Vasile: Ce să spun, atunci? Nu e încă   {table:{head:['Значение','Конъюнктив вместо императива'],rows:[['Уходите!','Să plecați! = Plecați imediat!'],['Не уходите!','Să nu plecați! = Nu plecați!'],['Давайте пойдём в кино!','Hai să mergem la un film!'],['Давай обсудим твои проблемы!','Să discutăm despre problemele tale!']]}},
